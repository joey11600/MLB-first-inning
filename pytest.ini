[pytest]
# THE SUITE IS `tests/` ONLY, AND THAT IS DELIBERATE.
#
# This repo contains ~40 files named test_*.py under tools/ and
# scripts/archive/ which are NOT tests -- they are one-off model
# experiments (test_days_rest.py, test_variant_g_2025.py,
# test_park_refresh.py, ...). They print findings and assert nothing,
# several take minutes and hit the network, and some train models.
# Pointing pytest at the repo root would collect all of them, so the
# testpaths below are what keeps `pytest` meaning "run the money tests"
# rather than "re-run a season of research".
testpaths = tests

# Fail loudly rather than skipping: an empty run is exit 5, and CI must
# not read that as success.
addopts = -ra --strict-markers

markers =
    money: touches staking, P&L, grading or the published record
    regression: pins a bug this system has already shipped once
