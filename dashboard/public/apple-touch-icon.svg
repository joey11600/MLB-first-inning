<?xml version="1.0" encoding="UTF-8"?>
<!--
  NRFI Terminal — 180x180 Apple-touch icon.
  iOS Add-to-Home-Screen normally requires PNG, but iOS 16+ accepts
  SVG.  For older iOS we fall back to the favicon data URI in
  layout.tsx (which iOS happily renders as a 180x180 home-screen
  icon).  Solid background + safe-zone confined diamond so iOS's
  rounded-rect mask doesn't crop content.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" role="img" aria-label="NRFI">
  <rect width="180" height="180" rx="36" fill="#0a0e14"/>
  <radialGradient id="halo" cx="0.5" cy="0.5" r="0.55">
    <stop offset="0"   stop-color="#22d3ee" stop-opacity="0.20"/>
    <stop offset="1"   stop-color="#22d3ee" stop-opacity="0"/>
  </radialGradient>
  <circle cx="90" cy="90" r="72" fill="url(#halo)"/>
  <path d="M90 22 L158 90 L90 158 L22 90 Z"
        fill="none" stroke="#22d3ee" stroke-width="6" stroke-linejoin="round"/>
  <path d="M90 54 L126 90 L90 126 L54 90 Z"
        fill="none" stroke="#a78bfa" stroke-width="2.5" stroke-linejoin="round" opacity="0.85"/>
  <circle cx="90" cy="90" r="5" fill="#22d3ee"/>
</svg>
