<?xml version="1.0" encoding="UTF-8"?>
<!--
  NRFI Terminal — 512px PWA icon (high-density / splash screen / chooser).
  Same geometry as icon-192.svg, scaled to 512.  Stroke widths are
  proportionally bumped for visual parity at large sizes.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="NRFI">
  <rect width="512" height="512" rx="96" fill="#0a0e14"/>

  <radialGradient id="halo" cx="0.5" cy="0.5" r="0.55">
    <stop offset="0"   stop-color="#22d3ee" stop-opacity="0.18"/>
    <stop offset="0.55" stop-color="#22d3ee" stop-opacity="0.04"/>
    <stop offset="1"   stop-color="#22d3ee" stop-opacity="0"/>
  </radialGradient>
  <circle cx="256" cy="256" r="208" fill="url(#halo)"/>

  <path d="M256 60 L452 256 L256 452 L60 256 Z"
        fill="none"
        stroke="#22d3ee"
        stroke-width="16"
        stroke-linejoin="round"/>

  <path d="M256 150 L362 256 L256 362 L150 256 Z"
        fill="none"
        stroke="#a78bfa"
        stroke-width="6"
        stroke-linejoin="round"
        opacity="0.85"/>

  <circle cx="256" cy="256" r="13" fill="#22d3ee"/>

  <!-- Wordmark beneath the diamond -- only visible at large sizes
       (Android splash screen, app drawer chooser). -->
  <text x="256" y="498"
        text-anchor="middle"
        font-family="ui-monospace, 'SF Mono', Menlo, monospace"
        font-size="36"
        font-weight="600"
        letter-spacing="6"
        fill="#22d3ee"
        opacity="0.85">NRFI</text>
</svg>
