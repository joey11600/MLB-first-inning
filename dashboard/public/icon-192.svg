<?xml version="1.0" encoding="UTF-8"?>
<!--
  NRFI Terminal — 192px PWA icon (Android home-screen / "any" purpose).
  Bloomberg-terminal aesthetic: cyan diamond mark over deep ink,
  with a thin violet inner inscription matching the dashboard's
  --primary (#22d3ee) / --secondary (#a78bfa) accents.

  Geometry chosen so the diamond fills ~80% of the canvas with
  generous gutter for OS-specific corner masking.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" role="img" aria-label="NRFI">
  <!-- Backdrop -->
  <rect width="192" height="192" rx="36" fill="#0a0e14"/>

  <!-- Faint cyan halo -->
  <radialGradient id="halo" cx="0.5" cy="0.5" r="0.55">
    <stop offset="0"   stop-color="#22d3ee" stop-opacity="0.18"/>
    <stop offset="0.55" stop-color="#22d3ee" stop-opacity="0.04"/>
    <stop offset="1"   stop-color="#22d3ee" stop-opacity="0"/>
  </radialGradient>
  <circle cx="96" cy="96" r="78" fill="url(#halo)"/>

  <!-- Diamond mark — uses the same M/path geometry as the in-app
       brand mark (see DashboardShell.module.css .mark) but scaled. -->
  <path d="M96 22 L170 96 L96 170 L22 96 Z"
        fill="none"
        stroke="#22d3ee"
        stroke-width="6"
        stroke-linejoin="round"/>

  <!-- Inner violet inscription = the "1st inning" feature -->
  <path d="M96 56 L136 96 L96 136 L56 96 Z"
        fill="none"
        stroke="#a78bfa"
        stroke-width="2.5"
        stroke-linejoin="round"
        opacity="0.85"/>

  <!-- Cyan pin at the centroid -->
  <circle cx="96" cy="96" r="5" fill="#22d3ee"/>
</svg>
