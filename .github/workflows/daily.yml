name: Daily NRFI predict + grade + weekly recalibrate

# Cron times are UTC.  EDT (Apr-Oct) = UTC-4, EST (Nov-Mar) = UTC-5.
#
# T2.8: DST AUTOMATION -- the schedule is now DST-agnostic.  Instead of
# defining cron entries against ONE timezone (EDT) and manually shifting
# every November + March, we schedule the predict job at EVERY hour from
# 12:00 to 23:00 UTC.  Reasoning:
#   - 12 UTC = 8am EDT = 7am EST  (covers earliest slate refresh)
#   - 23 UTC = 7pm EDT = 6pm EST  (covers latest pre-game refresh)
#   - 12 hours is enough to span 9am-7pm ET regardless of DST.
# A few cron firings outside of useful ET hours per year cost ~$0 on the
# GHA free tier (they finish in <30s when no slate exists), and we
# never have to remember the manual bump again.
#
# IMPORTANT: GitHub Actions schedule events are **best effort** -- they
# routinely fire 1-3 hours late on free runners when the queue is busy
# (observed: "9am ET" cron firing at 11:16 AM ET; "11:30 PM grade" at
# 2:16 AM).  To compensate we (a) schedule predict every hour 12-23 UTC
# so a missed slot is at most 60 minutes of staleness, and (b) augment
# with a Vercel cron that hits the dashboard's /api/cron/predict
# endpoint (which calls workflow_dispatch -- a higher-priority trigger
# than `schedule`).  See dashboard/vercel.json.
#
# Grade + recalibrate stay nightly, also DST-agnostic:
#   30  3 * * *  = 11:30 PM EDT / 10:30 PM EST  (after the latest game)
#   45  4 * * 1  = 12:45 AM EDT / 11:45 PM EST Sun (after the grade)
#
# Each predict refresh is idempotent + lock-aware: locked picks (game
# already started) are preserved; only pre-game picks can flip, with
# each flip logged to data/pick_changes.csv.
on:
  schedule:
    # Overnight opener-line capture (T2.20).  DK posts most overnight lines
    # by 8pm ET and updates them through the night; running at 1am ET grabs
    # the opening snapshot for CLV tracking before the morning crons start.
    # Also covers the "first scrape of the day" case so we don't lose 12hr
    # of pre-game lines that close before the 7am cron fires.
    - cron: "0 5 * * *"    # 1am EDT / 12am EST  -- overnight opener capture
    - cron: "0 12 * * *"   # 8am EDT / 7am EST
    - cron: "0 13 * * *"   # 9am EDT / 8am EST
    - cron: "0 14 * * *"   # 10am EDT / 9am EST
    - cron: "0 15 * * *"   # 11am EDT / 10am EST
    - cron: "0 16 * * *"   # 12pm EDT / 11am EST
    - cron: "0 17 * * *"   # 1pm EDT / 12pm EST
    - cron: "0 18 * * *"   # 2pm EDT / 1pm EST
    - cron: "0 19 * * *"   # 3pm EDT / 2pm EST
    - cron: "0 20 * * *"   # 4pm EDT / 3pm EST
    - cron: "0 21 * * *"   # 5pm EDT / 4pm EST
    - cron: "0 22 * * *"   # 6pm EDT / 5pm EST
    - cron: "0 23 * * *"   # 7pm EDT / 6pm EST
    # T2.26: extended evening coverage for late games.  Without these,
    # 9pm-10pm ET first-pitch games' last data refresh was at 7pm ET --
    # 2-3 hours of weather/lineup drift before lock-in.  Adding 8pm/
    # 9pm/10pm ET crons brings the worst-case freshness to ~60-90 min
    # pre-game for west-coast / late-evening starts.  Confirmed via
    # 2026-05-01 ATL@COL: wind shifted 11.9 -> 5.6 km/h between morning
    # and evening fetches, which would have shifted P(YRFI) on the
    # row before the bet was locked.
    - cron: "0 0 * * *"    # 8pm EDT / 7pm EST   -- catches 9pm games' final hour
    - cron: "0 1 * * *"    # 9pm EDT / 8pm EST   -- catches 10pm + west-coast games
    - cron: "0 2 * * *"    # 10pm EDT / 9pm EST  -- final pre-lock for west-coast
    - cron: "30 3 * * *"   # 11:30pm EDT / 10:30pm EST  -- nightly grade
    - cron: "45 4 * * 1"   # 12:45am EDT / 11:45pm EST Sun -- weekly recal
    # T2.65 (Option C lock-event capture): 5-min odds-only ticks during
    # prime game hours.  The hourly predict crons above scrape DK + import
    # at the top of each hour, but a game whose first pitch is at e.g.
    # 5:40 PM ET locks at 4:40 PM ET -- the 4pm cron (4:00 PM ET) runs
    # BEFORE the lock window opens, and the 5pm cron (5:00 PM ET) runs
    # 20 min AFTER lock.  If the 5pm cron fails (cron lag, DK transient
    # error), the next chance is 6pm -- 80 min after lock, by which time
    # the game is mid-1st-inning and we've missed the window entirely.
    #
    # Adding 5-min granularity caps the lock-to-odds-capture latency at
    # ~5 min worst-case.  Skipping minute 0 (where the hourly predict
    # already runs) avoids concurrency-group collisions.
    - cron: "5,10,15,20,25,30,35,40,45,50,55 17-23,0-3 * * *"   # every 5min, 1pm-11pm ET
    # T4.2 daily priors refresh: rebuild the per-pitcher per-date
    # truepit_priors JSON that production reads via the priors-pooled
    # _get_pitcher_statcast() path.  Runs at 6am UTC = 2am ET, after
    # all west-coast games end (latest finish ~1am ET) and well before
    # the morning predict crons (12 UTC).  This keeps the priors fresh
    # so today's predictions use yesterday's pitches in the pooled
    # estimate, not stale data.  Without this refresh, the priors
    # JSON would freeze at whatever date it was last built and the
    # 2026 cumulative term would never grow.
    - cron: "0 6 * * *"    # 2am EDT / 1am EST -- daily priors-pooled cache rebuild
  workflow_dispatch:
    inputs:
      action:
        description: "Which job to run"
        type: choice
        options: [predict, grade, recalibrate, refresh-priors]
        default: predict

permissions:
  contents: write

concurrency:
  group: daily-nrfi
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Need write back; default token has contents:write per `permissions:` above.
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Decide which action to run
        id: action
        env:
          SCHEDULE: ${{ github.event.schedule }}
          MANUAL:   ${{ github.event.inputs.action }}
        run: |
          # All hourly 9am-9pm ET predict cycles map to "predict" -- each
          # refresh pulls in newly-posted lineups + flips PASS - LINEUP
          # PENDING -> real verdict where applicable.  We catch by hour
          # prefix to avoid listing 11 explicit lines.
          case "$SCHEDULE" in
            "0 5 * * *"|"0 12 * * *"|"0 13 * * *"|"0 14 * * *"|"0 15 * * *"|"0 16 * * *"|"0 17 * * *"|"0 18 * * *"|"0 19 * * *"|"0 20 * * *"|"0 21 * * *"|"0 22 * * *"|"0 23 * * *"|"0 0 * * *"|"0 1 * * *"|"0 2 * * *")
              echo "what=predict" >> "$GITHUB_OUTPUT"
              ;;
            "30 3 * * *")
              echo "what=grade" >> "$GITHUB_OUTPUT"
              ;;
            "45 4 * * 1")
              echo "what=recalibrate" >> "$GITHUB_OUTPUT"
              ;;
            "5,10,15,20,25,30,35,40,45,50,55 17-23,0-3 * * *")
              # T2.65: 5-min odds-only tick (Option C lock-event capture).
              echo "what=odds-only" >> "$GITHUB_OUTPUT"
              ;;
            "0 6 * * *")
              # T4.2: daily priors-pooled cache + JSON rebuild.
              echo "what=refresh-priors" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "what=${MANUAL:-predict}" >> "$GITHUB_OUTPUT"
              ;;
          esac
          echo "today=$(TZ=America/New_York date +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
          echo "slate=$(TZ=America/New_York date +%m/%d/%Y)" >> "$GITHUB_OUTPUT"

      - name: Run predictor (predict)
        if: steps.action.outputs.what == 'predict'
        # Belt-and-suspenders: grade yesterday FIRST (in case the nightly
        # grade cron missed it due to GitHub Actions cron lag), then
        # predict today, then pull DraftKings odds + import for edge calc.
        # All ops are idempotent.
        #
        # We intentionally DO NOT use `|| true` to mask failures any more.
        # Each step records its outcome to data/system_errors.csv so the
        # dashboard / health endpoint can surface degraded state.  The
        # only step that's truly fail-soft is the catch-up grade -- if
        # yesterday's grade fails, we still want today's predict to run.
        env:
          ALERT_WEBHOOK_URL:    ${{ secrets.ALERT_WEBHOOK_URL }}
          # T2.22: Telegram pick-flip notifier.  When both vars are set,
          # tracker.log_picks pings the bot on every actionable flip
          # (PASS/PENDING -> STRONG/LEAN, side-flips, demotes).  Silent
          # no-op when unset, so this stays back-compat.
          TELEGRAM_BOT_TOKEN:   ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:     ${{ secrets.TELEGRAM_CHAT_ID }}
          # T2.30 / Phase 1.5: Supabase dual-write.  When both vars are
          # set, tracker.py mirrors every CSV write to the Supabase
          # picks_<season> + pick_changes tables so the dashboard can
          # cut over to Realtime reads in Phase 2 with no behavior
          # change.  Silent no-op when unset (back-compat for any
          # workflow that doesn't have the secrets configured yet).
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          ACTION: predict
        run: |
          YDAY=$(TZ='America/New_York' date -d 'yesterday' +%m/%d/%Y)
          TODAY_ISO=$(TZ='America/New_York' date +%Y-%m-%d)
          NOW_UTC=$(date -u +%Y-%m-%dT%H:%M:%SZ)

          # Helper: record a failure into data/system_errors.csv.  CSV
          # has a stable header; we append rather than rewrite.
          record_err() {
            local STEP="$1"; local CODE="$2"; local MSG="$3"
            mkdir -p data
            if [ ! -f data/system_errors.csv ]; then
              echo "captured_at_utc,date,step,exit_code,message" > data/system_errors.csv
            fi
            # CSV-escape the message (replace commas + quotes)
            local SAFE_MSG=$(echo "$MSG" | tr ',' ';' | tr '"' "'" | head -c 400)
            echo "$NOW_UTC,$TODAY_ISO,$STEP,$CODE,\"$SAFE_MSG\"" >> data/system_errors.csv
            echo "::warning::Step '$STEP' failed (exit $CODE): $SAFE_MSG"
          }

          echo "==> Catch-up grading $YDAY (yesterday)..."
          if ! python mlb_first_inning_predictor.py --date "$YDAY" --grade 2>grade_err.log; then
            record_err "grade-yesterday" "$?" "$(tail -c 400 grade_err.log)"
            # Soft-fail: continue to today's predict
          fi

          echo "==> Live-grading today's completed 1st innings..."
          # T2.27: grade today on every predict cron, not just at 11:30pm.
          # tracker.grade_date skips games whose 1st inning isn't complete
          # yet, so this is idempotent and safe to run on every cron.
          # Without this, a STRONG bet that wins in the bottom of the 1st
          # at 7:30pm doesn't show as graded WIN on the dashboard until
          # the dedicated grade cron at UTC 3:30 (11:30pm ET) -- a 3-4
          # hour delay where the user can't see their own win.
          if ! python mlb_first_inning_predictor.py --date "$TODAY_ISO" --grade 2>>grade_err.log; then
            record_err "grade-today" "$?" "$(tail -c 400 grade_err.log)"
            # Soft-fail: even if grade-today errors, predict should still run.
          fi

          echo "==> Predicting today's slate..."
          if ! python mlb_first_inning_predictor.py 2>predict_err.log; then
            record_err "predict" "$?" "$(tail -c 400 predict_err.log)"
            # Hard-fail: predict is the heart of the slate; abort run
            exit 1
          fi

          echo "==> Scraping DraftKings odds for $TODAY_ISO..."
          set +e
          python scrape_dk_odds.py 2>scrape_err.log
          DK_RC=$?
          set -e
          if [ "$DK_RC" -eq 2 ]; then
            # Exit 2 = scraper detected stale API IDs (0 markets during
            # prime hours).  Loud warning, but we proceed without odds.
            record_err "scrape-dk" "$DK_RC" "DK API IDs likely stale -- 0 markets in prime hours"
          elif [ "$DK_RC" -ne 0 ]; then
            record_err "scrape-dk" "$DK_RC" "$(tail -c 400 scrape_err.log)"
          fi

          ODDS_CSV="data/odds/dk_${TODAY_ISO}.csv"
          if [ -s "$ODDS_CSV" ]; then
            # T4.4 (2026-05-04): HALT LIFTED -- T4.2 priors-pooled features
            # deployed.  Shadow on V2's 26 placed bets 4/29-5/04 (the period
            # after T2.53 broke the conservative ERA-blend) showed:
            #   V2 actual:        13-13  -2.61u  (50.0% hit)
            #   V2 + T4.2 shadow:  9-5   +1.80u  (64.3% hit, 12 PASS)
            #   Delta:                   +4.41u
            #
            # T4.2 caps downside by passing on small-sample-driven extreme
            # picks.  Specifically saved -3u on 5/03 (passed on 3 of the
            # 6 losses) and -1u on 5/04 (passed on the BOS@DET YRFI loss
            # whose 6.23 raw xera shrunk to 4.12 priors-pooled).
            #
            # Lifting halt at --min-edge 0.02 (the production default).
            # Threshold bands for STRONG picks (0.56/0.44) stay unchanged.
            echo "==> Importing $ODDS_CSV (edge >= 2% triggers bet_placed=Y)..."
            if ! python mlb_first_inning_predictor.py --import-odds "$ODDS_CSV" --min-edge 0.02 2>import_err.log; then
              record_err "import-odds" "$?" "$(tail -c 400 import_err.log)"
            fi
          else
            echo "==> No DK odds CSV for $TODAY_ISO -- skipping import (DK pulled markets or scraper broken)."
          fi

      - name: Run grader (grade)
        if: steps.action.outputs.what == 'grade'
        # Grade today AND yesterday (in ET).  GitHub Actions cron can fire
        # hours late; the scheduled 11:30pm ET grade has been observed
        # firing as late as 2-3am ET the next day, at which point
        # `TZ=America/New_York date` returns the WRONG date and the
        # original slate goes ungraded.  Grading both dates is idempotent
        # (already-graded games stay graded, new ones get filled in).
        env:
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
          # T2.30 / Phase 1.5: Supabase dual-write (see predict step
          # above for full rationale).  Mirrors graded results to
          # Supabase the moment they land in the CSV.
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          ACTION: grade
        run: |
          TODAY=$(TZ='America/New_York' date +%m/%d/%Y)
          YDAY=$(TZ='America/New_York' date -d 'yesterday' +%m/%d/%Y)
          TODAY_ISO=$(TZ='America/New_York' date +%Y-%m-%d)
          NOW_UTC=$(date -u +%Y-%m-%dT%H:%M:%SZ)

          record_err() {
            local STEP="$1"; local CODE="$2"; local MSG="$3"
            mkdir -p data
            if [ ! -f data/system_errors.csv ]; then
              echo "captured_at_utc,date,step,exit_code,message" > data/system_errors.csv
            fi
            local SAFE_MSG=$(echo "$MSG" | tr ',' ';' | tr '"' "'" | head -c 400)
            echo "$NOW_UTC,$TODAY_ISO,$STEP,$CODE,\"$SAFE_MSG\"" >> data/system_errors.csv
            echo "::warning::Step '$STEP' failed (exit $CODE): $SAFE_MSG"
            # Optional webhook alert -- set ALERT_WEBHOOK_URL secret in
            # the repo (Slack incoming webhook, Discord, ntfy.sh, etc.).
            # Posts JSON {text} which Slack/Discord both accept.
            if [ -n "${ALERT_WEBHOOK_URL:-}" ]; then
              local PAYLOAD=$(printf '{"text":"NRFI %s [%s]: step \"%s\" failed (exit %s) -- %s"}' \
                "$ACTION" "$TODAY_ISO" "$STEP" "$CODE" "$SAFE_MSG")
              curl -fsS -X POST -H 'Content-Type: application/json' \
                -d "$PAYLOAD" "$ALERT_WEBHOOK_URL" >/dev/null 2>&1 || true
            fi
          }

          echo "==> Grading $YDAY (yesterday)..."
          if ! python mlb_first_inning_predictor.py --date "$YDAY" --grade 2>grade_y_err.log; then
            record_err "grade-yesterday" "$?" "$(tail -c 400 grade_y_err.log)"
          fi
          echo "==> Grading $TODAY (today)..."
          if ! python mlb_first_inning_predictor.py --date "$TODAY" --grade 2>grade_t_err.log; then
            record_err "grade-today" "$?" "$(tail -c 400 grade_t_err.log)"
          fi

      - name: Auto-classify new losses (T2.48)
        if: steps.action.outputs.what == 'grade'
        # Runs after grading completes.  analyze_losses.py is idempotent
        # and skip-by-key, so already-classified losses are no-ops; only
        # the just-graded LOSS rows get hit.  Soft-fail because the
        # classifier is observability tooling -- a failure here must
        # not break the daily grade workflow.
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          set +e
          python tools/analyze_losses.py 2>&1 || echo "::warning::analyze_losses failed (non-blocking)"

      - name: Backfill variants A/C/AC (T2.51 A/B harness)
        if: steps.action.outputs.what == 'grade'
        # Re-runs the variant backfill after each grade cycle so the
        # pick_variants table stays current with newly-graded rows.
        # Default invocation skips already-done (date, game_pk, variant)
        # tuples so steady-state cost is just the new picks.  Soft-fail.
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          set +e
          python tools/backfill_variants.py 2>&1 || echo "::warning::backfill_variants failed (non-blocking)"

      - name: Run odds-only capture (T2.65 lock-event tick)
        if: steps.action.outputs.what == 'odds-only'
        # T2.65 / Option C: lightweight tick fired every 5 min during
        # prime game hours (see cron above for rationale).  Does:
        #   1. T2.65c: live grade today's slate (catches NRFI/YRFI hits
        #      within ~5min of the 1st inning ending, not 30-90min after
        #      via the unreliable hourly predict cron).
        #   2. Scrape DK + --import-odds (caps lock-to-odds latency at
        #      ~5min instead of up-to-60min).
        #   3. T2.65b: live_state.py --once fallback (Railway worker backup).
        # Skips the heavy predict step -- that stays owned by the hourly
        # predict cron, which also re-runs grade-today as belt-and-suspenders.
        #
        # The --import-odds command iterates picks_2026 and applies
        # odds + bet_placed=Y to any STRONG row that's inside its
        # lock window (60 min pre-game).  By running every 5 min, the
        # worst-case lock-to-odds-capture latency is ~5 min instead of
        # the prior up-to-60 min (or unbounded if the hourly cron
        # errors).
        env:
          ALERT_WEBHOOK_URL:    ${{ secrets.ALERT_WEBHOOK_URL }}
          TELEGRAM_BOT_TOKEN:   ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:     ${{ secrets.TELEGRAM_CHAT_ID }}
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          ACTION: odds-only
        run: |
          TODAY_ISO=$(TZ='America/New_York' date +%Y-%m-%d)
          NOW_UTC=$(date -u +%Y-%m-%dT%H:%M:%SZ)

          # Same record_err helper as the predict step.  Defined inline
          # because shell functions don't persist across steps.
          record_err() {
            local STEP="$1"; local CODE="$2"; local MSG="$3"
            mkdir -p data
            if [ ! -f data/system_errors.csv ]; then
              echo "captured_at_utc,date,step,exit_code,message" > data/system_errors.csv
            fi
            local SAFE_MSG=$(echo "$MSG" | tr ',' ';' | tr '"' "'" | head -c 400)
            echo "$NOW_UTC,$TODAY_ISO,$STEP,$CODE,\"$SAFE_MSG\"" >> data/system_errors.csv
            echo "::warning::Step '$STEP' failed (exit $CODE): $SAFE_MSG"
          }

          # T2.65c: live grade tick.  When a game's 1st inning completes
          # mid-slate (e.g. NRFI hits at 7:08 PM), the dashboard should
          # show WIN/LOSS within ~5 min, not wait for the next hourly
          # predict cron -- which on GitHub's free runners has been
          # observed firing 30-90 min late, leaving the user staring
          # at an ungraded row while their bet has clearly resolved.
          # grade_date is idempotent + fast: it skips games whose 1st
          # inning isn't complete yet, so calling on every 5-min tick
          # is safe.  Runs FIRST so a DK scrape outage doesn't block it.
          echo "==> [odds-only] Live-grading completed 1st innings for $TODAY_ISO..."
          if ! python mlb_first_inning_predictor.py --date "$TODAY_ISO" --grade 2>grade_err.log; then
            record_err "odds-only-grade" "$?" "$(tail -c 400 grade_err.log)"
          fi

          echo "==> [odds-only] Scraping DraftKings odds for $TODAY_ISO..."
          set +e
          python scrape_dk_odds.py 2>scrape_err.log
          DK_RC=$?
          set -e
          if [ "$DK_RC" -eq 2 ]; then
            record_err "odds-only-scrape" "$DK_RC" "DK API IDs likely stale"
          elif [ "$DK_RC" -ne 0 ]; then
            record_err "odds-only-scrape" "$DK_RC" "$(tail -c 400 scrape_err.log)"
          fi

          ODDS_CSV="data/odds/dk_${TODAY_ISO}.csv"
          if [ -s "$ODDS_CSV" ]; then
            # T4.4: halt lifted, T4.2 priors-pooling deployed (see predict
            # step for shadow numbers).
            echo "==> [odds-only] Importing $ODDS_CSV (edge >= 2% triggers bet_placed=Y)..."
            if ! python mlb_first_inning_predictor.py --import-odds "$ODDS_CSV" --min-edge 0.02 2>import_err.log; then
              record_err "odds-only-import" "$?" "$(tail -c 400 import_err.log)"
            fi
          else
            echo "==> [odds-only] No DK odds CSV for $TODAY_ISO -- skipping import."
          fi

          # T2.65b: live game-state poll fallback.
          #
          # workers/live_state.py is normally a long-running Railway worker
          # that polls MLB Stats API every 10s and upserts to Supabase
          # live_game_state.  When Railway is healthy, that worker keeps
          # the dashboard's live game state (inning/score) fresh sub-second.
          # When Railway dies (observed 2026-05-03 -> 24+ hour outage with
          # no detection), the dashboard goes silent on live state.
          #
          # This 5-min --once fallback gives us GitHub-Actions-driven backup
          # coverage: even if Railway stays dead indefinitely, the dashboard
          # never goes more than ~5-10 min without a live-state refresh.
          # Latency is worse than Railway (10s -> 5min), but it's a guaranteed
          # baseline.  When Railway is healthy, it'll keep updating in
          # parallel and the user sees Railway's faster updates; the GH
          # tick just no-ops when there's nothing changed.
          echo "==> [odds-only] Running live_state.py --once (Railway fallback)..."
          if ! python workers/live_state.py --once 2>livestate_err.log; then
            record_err "odds-only-livestate" "$?" "$(tail -c 400 livestate_err.log)"
          fi

      - name: Calibration drift monitor (T2.59)
        if: steps.action.outputs.what == 'grade'
        # Watches whether stated P(pick) matches actual hit rate per bucket
        # over rolling windows.  Writes to system_errors when a bucket
        # drifts >=7pp persistently (flagged in BOTH 14d AND 30d windows
        # AND has >=30 bets per window).  Soft-fail.
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          set +e
          python tools/calibration_monitor.py --alert 2>&1 \
            || echo "::warning::calibration_monitor failed (non-blocking)"

      - name: Daily T4.2 shadow report (diagnostics)
        if: steps.action.outputs.what == 'grade'
        # Per-day apples-to-apples comparison of V2 actual placed bets
        # vs what V2 + T4.2 priors-pooling WOULD have predicted on the
        # same row.  Writes:
        #   data/diagnostics/shadow_<date>.csv      -- per-bet detail
        #   data/diagnostics/shadow_summary.csv     -- one row per day
        #
        # The summary file gives a moving timeline so we can verify T4.2
        # keeps producing positive delta over production.  If delta turns
        # negative for 5+ consecutive days, T4.2 has drifted and we need
        # to investigate (priors stale, feature regression, etc.).
        # Soft-fail so a diagnostic hiccup doesn't block the grade commit.
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          set +e
          # T4.4 (this commit): runs after grade so yesterday's bets are
          # final.  Default arg picks "yesterday ET", matching the date
          # the grade step just finalized.
          python tools/daily_shadow_report.py 2>&1 \
            || echo "::warning::daily_shadow_report failed (non-blocking)"

      - name: Feature drift monitor (T4.5)
        if: steps.action.outputs.what == 'grade'
        # Daily check: did the feature distributions on yesterday's slate
        # drift from the trailing 7-day baseline?  Catches the T2.53-class
        # regression where a code change silently shifts a feature's
        # distribution (in that case: pitcher_q tag flipped from 'ltd'
        # to 'live' for 24 of 30 pitchers, disabling protective ERA-blend
        # shrinkage).  When run retroactively against 5/03 this monitor
        # would have fired 5 HIGH alerts (4 pitcher_q distribution flips
        # + 1 calibrator-cluster bin-collapse detection) before the bets
        # locked -- vs 0 HIGH alerts on the prior normal day.
        #
        # Telegram fires on HIGH severity only.  MEDIUM alerts get
        # appended to data/system_errors.csv (visible in dashboard's
        # Ops Health card) but no notification.  Soft-fail.
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set +e
          python tools/feature_drift_monitor.py 2>&1 \
            || echo "::warning::feature_drift_monitor failed (non-blocking)"

      - name: Per-pick reasoning log (T4.6)
        if: steps.action.outputs.what == 'grade'
        # For each STRONG pick on yesterday's slate, write a JSON entry
        # with: top-5 LR feature contributions per half (z-score, weight,
        # logit contribution), calibrator band info (flat-zone detection),
        # raw-cache vs priors-pooled Statcast comparison, pitcher_q tags,
        # and a warnings list flagging outliers.
        #
        # Output: data/diagnostics/picks/<date>.json
        #
        # Future losing-bet debugging:
        #   jq '.picks[] | select(.graded_result == "LOSS") | .warnings'
        #     data/diagnostics/picks/<date>.json
        # tells you the dominant feature on every loss in seconds.
        # Soft-fail.
        run: |
          set +e
          python tools/pick_reasoning_log.py 2>&1 \
            || echo "::warning::pick_reasoning_log failed (non-blocking)"

      - name: Recalibrate (weekly)
        if: steps.action.outputs.what == 'recalibrate'
        run: |
          # Order matters: park factors first (they're the dominant feature)
          # then refit the calibrator on fresh park factors.
          python rebuild_park_factors.py
          python recalibrate_v2.py

      - name: Refresh priors-pooled Statcast cache (T4.2 daily)
        if: steps.action.outputs.what == 'refresh-priors'
        # Rebuilds data/v2_perfect_2026/truepit_priors_per_pitcher_per_date.json
        # from scratch.  Production's _get_pitcher_statcast() reads this file
        # to apply Bayesian shrinkage (2025 prior + 2026 cumulative-thru-
        # yesterday) so xera/whiff don't get whipsawed by small-sample 2026
        # noise (root cause of the 5/03 -4.56u disaster: ARI@CHC away pitcher
        # had cache xera=14.71 from a 5-batted-ball sample; pooled value
        # was 4.62, preserving the protective shrinkage T2.53 inadvertently
        # disabled by re-tagging early-season pitchers as 'live').
        #
        # Why delete the cache directory first: backfill_truepit_2026.py
        # caches per-pitcher fetches in data/cache/perpitch_2026/ keyed only
        # by player_id (no end-date in the key), so re-running the script
        # otherwise serves yesterday's cached snapshot indefinitely.  Wiping
        # the directory forces a fresh Statcast pull through 2026-04-01 ->
        # today.  Cost: ~30-50 min for ~250 pitchers (pybaseball rate-
        # limited).  Acceptable overnight given the 6h buffer before the
        # 12 UTC predict cron starts.
        env:
          # No SUPABASE_* needed; this step writes only local files.
          ACTION: refresh-priors
        run: |
          set -euo pipefail

          echo "==> Wiping per-pitch 2026 cache to force fresh Statcast pull..."
          rm -rf data/cache/perpitch_2026
          mkdir -p data/cache/perpitch_2026

          echo "==> Backfilling per-pitch Statcast (this takes ~30-50 min)..."
          python tools/backfill_truepit_2026.py 2>backfill_err.log || {
            echo "::warning::backfill_truepit_2026 exited non-zero -- continuing to priors build with whatever was cached"
            tail -c 600 backfill_err.log || true
          }

          echo "==> Rebuilding priors-pooled per-pitcher per-date snapshots..."
          python tools/build_truepit_2026_with_priors.py 2>priors_err.log || {
            echo "::error::build_truepit_2026_with_priors failed -- aborting refresh (kept previous JSON)"
            tail -c 600 priors_err.log
            exit 1
          }

          echo "==> Sanity-checking the rebuilt JSON..."
          python - <<'PY'
          import json, sys
          path = "data/v2_perfect_2026/truepit_priors_per_pitcher_per_date.json"
          with open(path, encoding="utf-8") as f:
              d = json.load(f)
          n_pitchers = len(d.get("per_pitcher", {}) or {})
          n_with_prior    = d.get("n_with_prior") or 0
          n_without_prior = d.get("n_without_prior") or 0
          print(f"Pitchers in priors JSON: {n_pitchers}  with-2025-prior={n_with_prior}  without={n_without_prior}")
          if n_pitchers < 100:
              sys.exit(f"Sanity FAILED: only {n_pitchers} pitchers in JSON; aborting commit")
          if n_with_prior < 50:
              sys.exit(f"Sanity FAILED: only {n_with_prior} pitchers have 2025 priors; aborting commit")
          PY

      - name: Commit data changes (if any)
        env:
          ACTION:  ${{ steps.action.outputs.what }}
          TODAY:   ${{ steps.action.outputs.today }}
        run: |
          # 5-second sleep before any git activity so any concurrent Python
          # process that's mid-write of picks_2026.csv has time to finish
          # the atomic rename.  Without this, an in-flight `os.replace()`
          # racing with `git add` could attach a half-written file to the
          # commit (the atomic-write change in tracker._write_rows
          # eliminates the truncated-file risk; this sleep eliminates the
          # "stale read between flush and replace" risk for git's perspective).
          sleep 5

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No data changes -- nothing to commit."
            exit 0
          fi
          git commit -m "auto: $ACTION $TODAY"

          # Push with rebase+retry.  Unbounded attempts (up to 8) with
          # jittered backoff -- the previous 3-attempt limit dropped 15+
          # minutes of compute on the floor when two crons happened to
          # collide.  At 8 attempts with 5-30s jitter we cover the worst
          # observed race (~3 cron firings within 90s).
          #
          # CSV-only conflicts (predict, grade, odds — all data files)
          # are auto-resolved by KEEPING OURS (this run's freshly-computed
          # output) and discarding origin's stale data.  This is safe
          # because each cron run is a complete recomputation; merging
          # would just produce duplicate-key chaos.  Code conflicts (any
          # non-data/ file) abort and surface the failure.
          BRANCH=$(git rev-parse --abbrev-ref HEAD)
          for attempt in $(seq 1 8); do
            if git push origin "$BRANCH"; then
              echo "push succeeded on attempt $attempt"
              exit 0
            fi
            JITTER=$(( ( RANDOM % 26 ) + 5 ))   # 5-30s
            echo "push attempt $attempt rejected; sleeping ${JITTER}s, then rebasing..."
            sleep "$JITTER"
            git fetch origin "$BRANCH"
            if ! git pull --rebase origin "$BRANCH"; then
              # Conflict -- check if it's data-only.
              CONFLICTS=$(git diff --name-only --diff-filter=U)
              NON_DATA_CONFLICTS=$(echo "$CONFLICTS" | grep -v '^data/' || true)
              if [ -z "$NON_DATA_CONFLICTS" ] && [ -n "$CONFLICTS" ]; then
                echo "data-only conflict, taking ours (this run's fresh data):"
                echo "$CONFLICTS"
                for f in $CONFLICTS; do
                  git checkout --ours -- "$f"
                  git add "$f"
                done
                git rebase --continue || git -c core.editor=true rebase --continue
              else
                echo "non-data conflict; cannot auto-resolve. Conflicting files:"
                echo "$CONFLICTS"
                git rebase --abort 2>/dev/null || true
                exit 1
              fi
            fi
          done
          echo "push still failing after 8 attempts"
          exit 1

      # T4.12: Healthchecks.io (or any compatible dead-man's-switch)
      # ping after a successful run.  If the user sets HEALTHCHECKS_URL
      # as a repo secret, every successful workflow GETs it; the
      # service alerts the user when expected pings stop arriving --
      # detects "cron silently stopped firing" without us having to
      # build alerting infra ourselves.  Quiet no-op when unset.
      - name: Ping Healthchecks.io (success)
        if: success() && steps.action.outputs.what == 'predict'
        env:
          HEALTHCHECKS_URL: ${{ secrets.HEALTHCHECKS_URL }}
        run: |
          if [ -n "${HEALTHCHECKS_URL:-}" ]; then
            curl -fsS -m 10 --retry 3 "$HEALTHCHECKS_URL" >/dev/null 2>&1 || true
          fi
      - name: Ping Healthchecks.io (failure)
        if: failure() && steps.action.outputs.what == 'predict'
        env:
          HEALTHCHECKS_URL: ${{ secrets.HEALTHCHECKS_URL }}
        run: |
          if [ -n "${HEALTHCHECKS_URL:-}" ]; then
            # /fail suffix tells Healthchecks the run failed (some
            # services support this; if not, it just 404s harmlessly).
            curl -fsS -m 10 --retry 3 "${HEALTHCHECKS_URL%/}/fail" >/dev/null 2>&1 || true
          fi
