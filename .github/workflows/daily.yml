name: Daily NRFI predict + grade + weekly recalibrate

# Cron times are UTC.  EDT (Apr-Oct) = UTC-4, EST (Nov-Mar) = UTC-5.
# Schedules below are EDT-aligned; bump each cron forward 1 hour after DST.
#   0  13 * * *   =  9:00 AM ET  -- predict today's slate
#   30  3 * * *   = 11:30 PM ET  -- grade today's slate
#   45  4 * * 1   = 12:45 AM ET Mon (= late Sunday) -- recalibrate after grade
on:
  schedule:
    - cron: "0 13 * * *"
    - cron: "30 3 * * *"
    - cron: "45 4 * * 1"
  workflow_dispatch:
    inputs:
      action:
        description: "Which job to run"
        type: choice
        options: [predict, grade, recalibrate]
        default: predict

permissions:
  contents: write

concurrency:
  group: daily-nrfi
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Need write back; default token has contents:write per `permissions:` above.
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Decide which action to run
        id: action
        env:
          SCHEDULE: ${{ github.event.schedule }}
          MANUAL:   ${{ github.event.inputs.action }}
        run: |
          if [ "$SCHEDULE" = "0 13 * * *" ]; then
            echo "what=predict" >> "$GITHUB_OUTPUT"
          elif [ "$SCHEDULE" = "30 3 * * *" ]; then
            echo "what=grade" >> "$GITHUB_OUTPUT"
          elif [ "$SCHEDULE" = "45 4 * * 1" ]; then
            echo "what=recalibrate" >> "$GITHUB_OUTPUT"
          else
            echo "what=${MANUAL:-predict}" >> "$GITHUB_OUTPUT"
          fi
          echo "today=$(TZ=America/New_York date +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
          echo "slate=$(TZ=America/New_York date +%m/%d/%Y)" >> "$GITHUB_OUTPUT"

      - name: Run predictor (predict)
        if: steps.action.outputs.what == 'predict'
        # Belt-and-suspenders: grade yesterday FIRST (in case the nightly
        # grade cron missed it due to GitHub Actions cron lag), then
        # predict today.  Both ops are idempotent.
        run: |
          YDAY=$(TZ='America/New_York' date -d 'yesterday' +%m/%d/%Y)
          echo "Catch-up grading $YDAY (yesterday) before predicting today..."
          python mlb_first_inning_predictor.py --date "$YDAY" --grade || true
          python mlb_first_inning_predictor.py

      - name: Run grader (grade)
        if: steps.action.outputs.what == 'grade'
        # Grade today AND yesterday (in ET).  GitHub Actions cron can fire
        # hours late; the scheduled 11:30pm ET grade has been observed
        # firing as late as 2-3am ET the next day, at which point
        # `TZ=America/New_York date` returns the WRONG date and the
        # original slate goes ungraded.  Grading both dates is idempotent
        # (already-graded games stay graded, new ones get filled in).
        run: |
          TODAY=$(TZ='America/New_York' date +%m/%d/%Y)
          YDAY=$(TZ='America/New_York' date -d 'yesterday' +%m/%d/%Y)
          echo "Grading $YDAY (yesterday) and $TODAY (today)"
          python mlb_first_inning_predictor.py --date "$YDAY"  --grade || true
          python mlb_first_inning_predictor.py --date "$TODAY" --grade || true

      - name: Recalibrate (weekly)
        if: steps.action.outputs.what == 'recalibrate'
        run: |
          # Order matters: park factors first (they're the dominant feature)
          # then refit the calibrator on fresh park factors.
          python rebuild_park_factors.py
          python recalibrate_v2.py

      - name: Commit data changes (if any)
        env:
          ACTION:  ${{ steps.action.outputs.what }}
          TODAY:   ${{ steps.action.outputs.today }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No data changes -- nothing to commit."
            exit 0
          fi
          git commit -m "auto: $ACTION $TODAY"
          # Push with rebase+retry.  The manual Predict/Grade buttons can
          # race with each other, with the cron schedules, and with manual
          # commits to the same branch -- a naive `git push` fails with
          # "fetch first" in that case.  Rebasing on origin and retrying
          # handles the common case (CSV data appended by both sides).
          BRANCH=$(git rev-parse --abbrev-ref HEAD)
          for attempt in 1 2 3; do
            if git push; then exit 0; fi
            echo "push attempt $attempt rejected; rebasing onto origin/$BRANCH..."
            if ! git pull --rebase origin "$BRANCH"; then
              echo "rebase produced a conflict; cannot auto-resolve"
              git rebase --abort 2>/dev/null || true
              exit 1
            fi
          done
          echo "push still failing after 3 attempts"
          exit 1
