name: Daily NRFI predict + grade + weekly recalibrate

# Cron times are UTC.  EDT (Apr-Oct) = UTC-4, EST (Nov-Mar) = UTC-5.
#
# T2.8: DST AUTOMATION -- the schedule is now DST-agnostic.  Instead of
# defining cron entries against ONE timezone (EDT) and manually shifting
# every November + March, we schedule the predict job at EVERY hour from
# 12:00 to 23:00 UTC.  Reasoning:
#   - 12 UTC = 8am EDT = 7am EST  (covers earliest slate refresh)
#   - 23 UTC = 7pm EDT = 6pm EST  (covers latest pre-game refresh)
#   - 12 hours is enough to span 9am-7pm ET regardless of DST.
# A few cron firings outside of useful ET hours per year cost ~$0 on the
# GHA free tier (they finish in <30s when no slate exists), and we
# never have to remember the manual bump again.
#
# IMPORTANT: GitHub Actions schedule events are **best effort** -- they
# routinely fire 1-3 hours late on free runners when the queue is busy
# (observed: "9am ET" cron firing at 11:16 AM ET; "11:30 PM grade" at
# 2:16 AM).  To compensate we (a) schedule predict every hour 12-23 UTC
# so a missed slot is at most 60 minutes of staleness, and (b) augment
# with a Vercel cron that hits the dashboard's /api/cron/predict
# endpoint (which calls workflow_dispatch -- a higher-priority trigger
# than `schedule`).  See dashboard/vercel.json.
#
# Grade + recalibrate stay nightly, also DST-agnostic:
#   30  3 * * *  = 11:30 PM EDT / 10:30 PM EST  (after the latest game)
#   45  4 * * 1  = 12:45 AM EDT / 11:45 PM EST Sun (after the grade)
#
# Each predict refresh is idempotent + lock-aware: locked picks (game
# already started) are preserved; only pre-game picks can flip, with
# each flip logged to data/pick_changes.csv.
on:
  schedule:
    # Overnight opener-line capture (T2.20).  DK posts most overnight lines
    # by 8pm ET and updates them through the night; running at 1am ET grabs
    # the opening snapshot for CLV tracking before the morning crons start.
    # Also covers the "first scrape of the day" case so we don't lose 12hr
    # of pre-game lines that close before the 7am cron fires.
    - cron: "0 5 * * *"    # 1am EDT / 12am EST  -- overnight opener capture
    - cron: "0 12 * * *"   # 8am EDT / 7am EST
    - cron: "0 13 * * *"   # 9am EDT / 8am EST
    - cron: "0 14 * * *"   # 10am EDT / 9am EST
    - cron: "0 15 * * *"   # 11am EDT / 10am EST
    - cron: "0 16 * * *"   # 12pm EDT / 11am EST
    - cron: "0 17 * * *"   # 1pm EDT / 12pm EST
    - cron: "0 18 * * *"   # 2pm EDT / 1pm EST
    - cron: "0 19 * * *"   # 3pm EDT / 2pm EST
    - cron: "0 20 * * *"   # 4pm EDT / 3pm EST
    - cron: "0 21 * * *"   # 5pm EDT / 4pm EST
    - cron: "0 22 * * *"   # 6pm EDT / 5pm EST
    - cron: "0 23 * * *"   # 7pm EDT / 6pm EST
    # T2.26: extended evening coverage for late games.  Without these,
    # 9pm-10pm ET first-pitch games' last data refresh was at 7pm ET --
    # 2-3 hours of weather/lineup drift before lock-in.  Adding 8pm/
    # 9pm/10pm ET crons brings the worst-case freshness to ~60-90 min
    # pre-game for west-coast / late-evening starts.  Confirmed via
    # 2026-05-01 ATL@COL: wind shifted 11.9 -> 5.6 km/h between morning
    # and evening fetches, which would have shifted P(YRFI) on the
    # row before the bet was locked.
    - cron: "0 0 * * *"    # 8pm EDT / 7pm EST   -- catches 9pm games' final hour
    - cron: "0 1 * * *"    # 9pm EDT / 8pm EST   -- catches 10pm + west-coast games
    - cron: "0 2 * * *"    # 10pm EDT / 9pm EST  -- final pre-lock for west-coast
    - cron: "30 3 * * *"   # 11:30pm EDT / 10:30pm EST  -- nightly grade
    - cron: "45 4 * * 1"   # 12:45am EDT / 11:45pm EST Sun -- weekly recal
  workflow_dispatch:
    inputs:
      action:
        description: "Which job to run"
        type: choice
        options: [predict, grade, recalibrate]
        default: predict

permissions:
  contents: write

concurrency:
  group: daily-nrfi
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Need write back; default token has contents:write per `permissions:` above.
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Decide which action to run
        id: action
        env:
          SCHEDULE: ${{ github.event.schedule }}
          MANUAL:   ${{ github.event.inputs.action }}
        run: |
          # All hourly 9am-9pm ET predict cycles map to "predict" -- each
          # refresh pulls in newly-posted lineups + flips PASS - LINEUP
          # PENDING -> real verdict where applicable.  We catch by hour
          # prefix to avoid listing 11 explicit lines.
          case "$SCHEDULE" in
            "0 5 * * *"|"0 12 * * *"|"0 13 * * *"|"0 14 * * *"|"0 15 * * *"|"0 16 * * *"|"0 17 * * *"|"0 18 * * *"|"0 19 * * *"|"0 20 * * *"|"0 21 * * *"|"0 22 * * *"|"0 23 * * *"|"0 0 * * *"|"0 1 * * *"|"0 2 * * *")
              echo "what=predict" >> "$GITHUB_OUTPUT"
              ;;
            "30 3 * * *")
              echo "what=grade" >> "$GITHUB_OUTPUT"
              ;;
            "45 4 * * 1")
              echo "what=recalibrate" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "what=${MANUAL:-predict}" >> "$GITHUB_OUTPUT"
              ;;
          esac
          echo "today=$(TZ=America/New_York date +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
          echo "slate=$(TZ=America/New_York date +%m/%d/%Y)" >> "$GITHUB_OUTPUT"

      - name: Run predictor (predict)
        if: steps.action.outputs.what == 'predict'
        # Belt-and-suspenders: grade yesterday FIRST (in case the nightly
        # grade cron missed it due to GitHub Actions cron lag), then
        # predict today, then pull DraftKings odds + import for edge calc.
        # All ops are idempotent.
        #
        # We intentionally DO NOT use `|| true` to mask failures any more.
        # Each step records its outcome to data/system_errors.csv so the
        # dashboard / health endpoint can surface degraded state.  The
        # only step that's truly fail-soft is the catch-up grade -- if
        # yesterday's grade fails, we still want today's predict to run.
        env:
          ALERT_WEBHOOK_URL:    ${{ secrets.ALERT_WEBHOOK_URL }}
          # T2.22: Telegram pick-flip notifier.  When both vars are set,
          # tracker.log_picks pings the bot on every actionable flip
          # (PASS/PENDING -> STRONG/LEAN, side-flips, demotes).  Silent
          # no-op when unset, so this stays back-compat.
          TELEGRAM_BOT_TOKEN:   ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:     ${{ secrets.TELEGRAM_CHAT_ID }}
          ACTION: predict
        run: |
          YDAY=$(TZ='America/New_York' date -d 'yesterday' +%m/%d/%Y)
          TODAY_ISO=$(TZ='America/New_York' date +%Y-%m-%d)
          NOW_UTC=$(date -u +%Y-%m-%dT%H:%M:%SZ)

          # Helper: record a failure into data/system_errors.csv.  CSV
          # has a stable header; we append rather than rewrite.
          record_err() {
            local STEP="$1"; local CODE="$2"; local MSG="$3"
            mkdir -p data
            if [ ! -f data/system_errors.csv ]; then
              echo "captured_at_utc,date,step,exit_code,message" > data/system_errors.csv
            fi
            # CSV-escape the message (replace commas + quotes)
            local SAFE_MSG=$(echo "$MSG" | tr ',' ';' | tr '"' "'" | head -c 400)
            echo "$NOW_UTC,$TODAY_ISO,$STEP,$CODE,\"$SAFE_MSG\"" >> data/system_errors.csv
            echo "::warning::Step '$STEP' failed (exit $CODE): $SAFE_MSG"
          }

          echo "==> Catch-up grading $YDAY (yesterday)..."
          if ! python mlb_first_inning_predictor.py --date "$YDAY" --grade 2>grade_err.log; then
            record_err "grade-yesterday" "$?" "$(tail -c 400 grade_err.log)"
            # Soft-fail: continue to today's predict
          fi

          echo "==> Predicting today's slate..."
          if ! python mlb_first_inning_predictor.py 2>predict_err.log; then
            record_err "predict" "$?" "$(tail -c 400 predict_err.log)"
            # Hard-fail: predict is the heart of the slate; abort run
            exit 1
          fi

          echo "==> Scraping DraftKings odds for $TODAY_ISO..."
          set +e
          python scrape_dk_odds.py 2>scrape_err.log
          DK_RC=$?
          set -e
          if [ "$DK_RC" -eq 2 ]; then
            # Exit 2 = scraper detected stale API IDs (0 markets during
            # prime hours).  Loud warning, but we proceed without odds.
            record_err "scrape-dk" "$DK_RC" "DK API IDs likely stale -- 0 markets in prime hours"
          elif [ "$DK_RC" -ne 0 ]; then
            record_err "scrape-dk" "$DK_RC" "$(tail -c 400 scrape_err.log)"
          fi

          ODDS_CSV="data/odds/dk_${TODAY_ISO}.csv"
          if [ -s "$ODDS_CSV" ]; then
            echo "==> Importing $ODDS_CSV (edge >= 2% triggers bet_placed=Y)..."
            if ! python mlb_first_inning_predictor.py --import-odds "$ODDS_CSV" --min-edge 0.02 2>import_err.log; then
              record_err "import-odds" "$?" "$(tail -c 400 import_err.log)"
            fi
          else
            echo "==> No DK odds CSV for $TODAY_ISO -- skipping import (DK pulled markets or scraper broken)."
          fi

      - name: Run grader (grade)
        if: steps.action.outputs.what == 'grade'
        # Grade today AND yesterday (in ET).  GitHub Actions cron can fire
        # hours late; the scheduled 11:30pm ET grade has been observed
        # firing as late as 2-3am ET the next day, at which point
        # `TZ=America/New_York date` returns the WRONG date and the
        # original slate goes ungraded.  Grading both dates is idempotent
        # (already-graded games stay graded, new ones get filled in).
        env:
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
          ACTION: grade
        run: |
          TODAY=$(TZ='America/New_York' date +%m/%d/%Y)
          YDAY=$(TZ='America/New_York' date -d 'yesterday' +%m/%d/%Y)
          TODAY_ISO=$(TZ='America/New_York' date +%Y-%m-%d)
          NOW_UTC=$(date -u +%Y-%m-%dT%H:%M:%SZ)

          record_err() {
            local STEP="$1"; local CODE="$2"; local MSG="$3"
            mkdir -p data
            if [ ! -f data/system_errors.csv ]; then
              echo "captured_at_utc,date,step,exit_code,message" > data/system_errors.csv
            fi
            local SAFE_MSG=$(echo "$MSG" | tr ',' ';' | tr '"' "'" | head -c 400)
            echo "$NOW_UTC,$TODAY_ISO,$STEP,$CODE,\"$SAFE_MSG\"" >> data/system_errors.csv
            echo "::warning::Step '$STEP' failed (exit $CODE): $SAFE_MSG"
            # Optional webhook alert -- set ALERT_WEBHOOK_URL secret in
            # the repo (Slack incoming webhook, Discord, ntfy.sh, etc.).
            # Posts JSON {text} which Slack/Discord both accept.
            if [ -n "${ALERT_WEBHOOK_URL:-}" ]; then
              local PAYLOAD=$(printf '{"text":"NRFI %s [%s]: step \"%s\" failed (exit %s) -- %s"}' \
                "$ACTION" "$TODAY_ISO" "$STEP" "$CODE" "$SAFE_MSG")
              curl -fsS -X POST -H 'Content-Type: application/json' \
                -d "$PAYLOAD" "$ALERT_WEBHOOK_URL" >/dev/null 2>&1 || true
            fi
          }

          echo "==> Grading $YDAY (yesterday)..."
          if ! python mlb_first_inning_predictor.py --date "$YDAY" --grade 2>grade_y_err.log; then
            record_err "grade-yesterday" "$?" "$(tail -c 400 grade_y_err.log)"
          fi
          echo "==> Grading $TODAY (today)..."
          if ! python mlb_first_inning_predictor.py --date "$TODAY" --grade 2>grade_t_err.log; then
            record_err "grade-today" "$?" "$(tail -c 400 grade_t_err.log)"
          fi

      - name: Recalibrate (weekly)
        if: steps.action.outputs.what == 'recalibrate'
        run: |
          # Order matters: park factors first (they're the dominant feature)
          # then refit the calibrator on fresh park factors.
          python rebuild_park_factors.py
          python recalibrate_v2.py

      - name: Commit data changes (if any)
        env:
          ACTION:  ${{ steps.action.outputs.what }}
          TODAY:   ${{ steps.action.outputs.today }}
        run: |
          # 5-second sleep before any git activity so any concurrent Python
          # process that's mid-write of picks_2026.csv has time to finish
          # the atomic rename.  Without this, an in-flight `os.replace()`
          # racing with `git add` could attach a half-written file to the
          # commit (the atomic-write change in tracker._write_rows
          # eliminates the truncated-file risk; this sleep eliminates the
          # "stale read between flush and replace" risk for git's perspective).
          sleep 5

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No data changes -- nothing to commit."
            exit 0
          fi
          git commit -m "auto: $ACTION $TODAY"

          # Push with rebase+retry.  Unbounded attempts (up to 8) with
          # jittered backoff -- the previous 3-attempt limit dropped 15+
          # minutes of compute on the floor when two crons happened to
          # collide.  At 8 attempts with 5-30s jitter we cover the worst
          # observed race (~3 cron firings within 90s).
          #
          # CSV-only conflicts (predict, grade, odds — all data files)
          # are auto-resolved by KEEPING OURS (this run's freshly-computed
          # output) and discarding origin's stale data.  This is safe
          # because each cron run is a complete recomputation; merging
          # would just produce duplicate-key chaos.  Code conflicts (any
          # non-data/ file) abort and surface the failure.
          BRANCH=$(git rev-parse --abbrev-ref HEAD)
          for attempt in $(seq 1 8); do
            if git push origin "$BRANCH"; then
              echo "push succeeded on attempt $attempt"
              exit 0
            fi
            JITTER=$(( ( RANDOM % 26 ) + 5 ))   # 5-30s
            echo "push attempt $attempt rejected; sleeping ${JITTER}s, then rebasing..."
            sleep "$JITTER"
            git fetch origin "$BRANCH"
            if ! git pull --rebase origin "$BRANCH"; then
              # Conflict -- check if it's data-only.
              CONFLICTS=$(git diff --name-only --diff-filter=U)
              NON_DATA_CONFLICTS=$(echo "$CONFLICTS" | grep -v '^data/' || true)
              if [ -z "$NON_DATA_CONFLICTS" ] && [ -n "$CONFLICTS" ]; then
                echo "data-only conflict, taking ours (this run's fresh data):"
                echo "$CONFLICTS"
                for f in $CONFLICTS; do
                  git checkout --ours -- "$f"
                  git add "$f"
                done
                git rebase --continue || git -c core.editor=true rebase --continue
              else
                echo "non-data conflict; cannot auto-resolve. Conflicting files:"
                echo "$CONFLICTS"
                git rebase --abort 2>/dev/null || true
                exit 1
              fi
            fi
          done
          echo "push still failing after 8 attempts"
          exit 1

      # T4.12: Healthchecks.io (or any compatible dead-man's-switch)
      # ping after a successful run.  If the user sets HEALTHCHECKS_URL
      # as a repo secret, every successful workflow GETs it; the
      # service alerts the user when expected pings stop arriving --
      # detects "cron silently stopped firing" without us having to
      # build alerting infra ourselves.  Quiet no-op when unset.
      - name: Ping Healthchecks.io (success)
        if: success() && steps.action.outputs.what == 'predict'
        env:
          HEALTHCHECKS_URL: ${{ secrets.HEALTHCHECKS_URL }}
        run: |
          if [ -n "${HEALTHCHECKS_URL:-}" ]; then
            curl -fsS -m 10 --retry 3 "$HEALTHCHECKS_URL" >/dev/null 2>&1 || true
          fi
      - name: Ping Healthchecks.io (failure)
        if: failure() && steps.action.outputs.what == 'predict'
        env:
          HEALTHCHECKS_URL: ${{ secrets.HEALTHCHECKS_URL }}
        run: |
          if [ -n "${HEALTHCHECKS_URL:-}" ]; then
            # /fail suffix tells Healthchecks the run failed (some
            # services support this; if not, it just 404s harmlessly).
            curl -fsS -m 10 --retry 3 "${HEALTHCHECKS_URL%/}/fail" >/dev/null 2>&1 || true
          fi
