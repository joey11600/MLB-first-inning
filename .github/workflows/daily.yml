name: Daily NRFI predict + grade + weekly recalibrate

# Cron times are UTC.  EDT (Apr-Oct) = UTC-4, EST (Nov-Mar) = UTC-5.
#
# T2.8: DST AUTOMATION -- the schedule is now DST-agnostic.  Instead of
# defining cron entries against ONE timezone (EDT) and manually shifting
# every November + March, we schedule the predict job at EVERY hour from
# 12:00 to 23:00 UTC.  Reasoning:
#   - 12 UTC = 8am EDT = 7am EST  (covers earliest slate refresh)
#   - 23 UTC = 7pm EDT = 6pm EST  (covers latest pre-game refresh)
#   - 12 hours is enough to span 9am-7pm ET regardless of DST.
# A few cron firings outside of useful ET hours per year cost ~$0 on the
# GHA free tier (they finish in <30s when no slate exists), and we
# never have to remember the manual bump again.
#
# IMPORTANT: GitHub Actions schedule events are **best effort** -- they
# routinely fire 1-3 hours late on free runners when the queue is busy
# (observed: "9am ET" cron firing at 11:16 AM ET; "11:30 PM grade" at
# 2:16 AM).  To compensate we (a) schedule predict every hour 12-23 UTC
# so a missed slot is at most 60 minutes of staleness, and (b) augment
# with a Vercel cron that hits the dashboard's /api/cron/predict
# endpoint (which calls workflow_dispatch -- a higher-priority trigger
# than `schedule`).  See dashboard/vercel.json.
#
# Grade + recalibrate stay nightly, also DST-agnostic:
#   30  3 * * *  = 11:30 PM EDT / 10:30 PM EST  (after the latest game)
#   45  4 * * 1  = 12:45 AM EDT / 11:45 PM EST Sun (after the grade)
#
# Each predict refresh is idempotent + lock-aware: locked picks (game
# already started) are preserved; only pre-game picks can flip, with
# each flip logged to data/pick_changes.csv.
on:
  schedule:
    # Overnight opener-line capture (T2.20).  DK posts most overnight lines
    # by 8pm ET and updates them through the night; running at 1am ET grabs
    # the opening snapshot for CLV tracking before the morning crons start.
    # Also covers the "first scrape of the day" case so we don't lose 12hr
    # of pre-game lines that close before the 7am cron fires.
    - cron: "0 5 * * *"    # 1am EDT / 12am EST  -- overnight opener capture
    - cron: "0 12 * * *"   # 8am EDT / 7am EST
    - cron: "0 13 * * *"   # 9am EDT / 8am EST
    - cron: "0 14 * * *"   # 10am EDT / 9am EST
    - cron: "0 15 * * *"   # 11am EDT / 10am EST
    - cron: "0 16 * * *"   # 12pm EDT / 11am EST
    - cron: "0 17 * * *"   # 1pm EDT / 12pm EST
    - cron: "0 18 * * *"   # 2pm EDT / 1pm EST
    - cron: "0 19 * * *"   # 3pm EDT / 2pm EST
    - cron: "0 20 * * *"   # 4pm EDT / 3pm EST
    - cron: "0 21 * * *"   # 5pm EDT / 4pm EST
    - cron: "0 22 * * *"   # 6pm EDT / 5pm EST
    - cron: "0 23 * * *"   # 7pm EDT / 6pm EST
    # T2.26: extended evening coverage for late games.  Without these,
    # 9pm-10pm ET first-pitch games' last data refresh was at 7pm ET --
    # 2-3 hours of weather/lineup drift before lock-in.  Adding 8pm/
    # 9pm/10pm ET crons brings the worst-case freshness to ~60-90 min
    # pre-game for west-coast / late-evening starts.  Confirmed via
    # 2026-05-01 ATL@COL: wind shifted 11.9 -> 5.6 km/h between morning
    # and evening fetches, which would have shifted P(YRFI) on the
    # row before the bet was locked.
    - cron: "0 0 * * *"    # 8pm EDT / 7pm EST   -- catches 9pm games' final hour
    - cron: "0 1 * * *"    # 9pm EDT / 8pm EST   -- catches 10pm + west-coast games
    - cron: "0 2 * * *"    # 10pm EDT / 9pm EST  -- final pre-lock for west-coast
    - cron: "30 3 * * *"   # 11:30pm EDT / 10:30pm EST  -- nightly grade
    # 2026-05-11: weekly auto-recalibrate cron DISABLED.  Per CLAUDE.md,
    # "Out-of-sample validation is non-negotiable for any model change."
    # The weekly cron was refitting calibration_v2.json + fi_park_factors.json
    # every Monday with no OOS validation, no Brier-regression guard, no
    # rollback path.  The 5/11 audit showed the practical impact is small
    # (bin shifts of 1-2pp, OOS Brier within +/-0.001 between refits), but
    # the GHA runner has no way to KNOW whether a given week's refit is
    # net-positive before shipping it -- which directly violates the rule.
    # Manual recalibration is still available via workflow_dispatch action
    # "recalibrate" (line ~88); run it only after `test_*.py`-style 3-split
    # OOS validation confirms no regression.
    # - cron: "45 4 * * 1"   # 12:45am EDT / 11:45pm EST Sun -- weekly recal
    # T-CLEANUP-2026-05-05: removed every-5-min odds-only cron.
    # Railway's predictor_loop (Procfile / mlb-first-inning service) now
    # owns DK scraping + odds import, running every 5 min on a clean
    # IP that DK doesn't 403.  GitHub's runner IPs are in Azure ranges
    # that DK fingerprints as bot traffic; this cron was failing every
    # tick for weeks before being removed.  Workflow_dispatch + manual
    # cron trigger still available if Railway is ever down for an
    # extended outage.
    # T4.2 daily priors refresh: rebuild the per-pitcher per-date
    # truepit_priors JSON that production reads via the priors-pooled
    # _get_pitcher_statcast() path.  Runs at 6am UTC = 2am ET, after
    # all west-coast games end (latest finish ~1am ET) and well before
    # the morning predict crons (12 UTC).  This keeps the priors fresh
    # so today's predictions use yesterday's pitches in the pooled
    # estimate, not stale data.  Without this refresh, the priors
    # JSON would freeze at whatever date it was last built and the
    # 2026 cumulative term would never grow.
    - cron: "0 6 * * *"    # 2am EDT / 1am EST -- daily priors-pooled cache rebuild
  workflow_dispatch:
    inputs:
      action:
        description: "Which job to run"
        type: choice
        options: [predict, grade, recalibrate, refresh-priors]
        default: predict

permissions:
  contents: write

concurrency:
  group: daily-nrfi
  cancel-in-progress: false

jobs:
  run:
    # T4.16: runner is selected by the repo variable RUNNER_LABEL (set
    # at /settings/variables/actions).
    #
    # THERE IS NO AUTOMATIC FAILOVER HERE.  CORRECTED 2026-08-06 -- this
    # comment used to claim workflows "still work ... if the self-hosted
    # runner is offline", and that is FALSE.  `||` tests whether the
    # VARIABLE IS EMPTY, never whether the machine is ALIVE.  RUNNER_LABEL
    # is currently set to "self-hosted", so the fallback can never fire:
    # if the runner goes offline, every job queues against a dead machine
    # for up to 24 hours and then reports conclusion=failure with ZERO
    # steps and no log ("The job was not acquired by Runner of type
    # self-hosted even after multiple attempts").  That is exactly what
    # happened to run #3184 on 2026-08-06.
    #
    # RECOVERY IS MANUAL: set RUNNER_LABEL to `ubuntu-latest` (or delete
    # it) at /settings/variables/actions -- see docs/SELF_HOSTED_RUNNER.md.
    # Note GitHub bills for hosted minutes, so it is a lever, not a
    # default.  The only TRUE failover GitHub offers is registering a
    # second runner carrying the same `self-hosted` label; `runs-on` with
    # two labels means "must have BOTH", so failover cannot be expressed
    # here in the workflow file.
    #
    # `.github/workflows/runner_watchdog.yml` (pinned to ubuntu-latest so
    # it survives this machine dying) now Telegrams the operator when a
    # job goes unpicked or predictions stop.
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Need write back; default token has contents:write per `permissions:` above.
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Decide which action to run
        id: action
        env:
          SCHEDULE: ${{ github.event.schedule }}
          MANUAL:   ${{ github.event.inputs.action }}
        run: |
          # All hourly 9am-9pm ET predict cycles map to "predict" -- each
          # refresh pulls in newly-posted lineups + flips PASS - LINEUP
          # PENDING -> real verdict where applicable.  We catch by hour
          # prefix to avoid listing 11 explicit lines.
          case "$SCHEDULE" in
            "0 5 * * *"|"0 12 * * *"|"0 13 * * *"|"0 14 * * *"|"0 15 * * *"|"0 16 * * *"|"0 17 * * *"|"0 18 * * *"|"0 19 * * *"|"0 20 * * *"|"0 21 * * *"|"0 22 * * *"|"0 23 * * *"|"0 0 * * *"|"0 1 * * *"|"0 2 * * *")
              echo "what=predict" >> "$GITHUB_OUTPUT"
              ;;
            "30 3 * * *")
              echo "what=grade" >> "$GITHUB_OUTPUT"
              ;;
            "45 4 * * 1")
              echo "what=recalibrate" >> "$GITHUB_OUTPUT"
              ;;
            # T-CLEANUP-2026-05-05: dropped 5-min odds-only branch.
            # Cron schedule + step both removed (Railway owns DK scrape).
            "0 6 * * *")
              # T4.2: daily priors-pooled cache + JSON rebuild.
              echo "what=refresh-priors" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "what=${MANUAL:-predict}" >> "$GITHUB_OUTPUT"
              ;;
          esac
          echo "today=$(TZ=America/New_York date +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
          echo "slate=$(TZ=America/New_York date +%m/%d/%Y)" >> "$GITHUB_OUTPUT"

      - name: Run predictor (predict)
        if: steps.action.outputs.what == 'predict'
        # Belt-and-suspenders: grade yesterday FIRST (in case the nightly
        # grade cron missed it due to GitHub Actions cron lag), then
        # predict today, then pull DraftKings odds + import for edge calc.
        # All ops are idempotent.
        #
        # We intentionally DO NOT use `|| true` to mask failures any more.
        # Each step records its outcome to data/system_errors.csv so the
        # dashboard / health endpoint can surface degraded state.  The
        # only step that's truly fail-soft is the catch-up grade -- if
        # yesterday's grade fails, we still want today's predict to run.
        env:
          ALERT_WEBHOOK_URL:    ${{ secrets.ALERT_WEBHOOK_URL }}
          # T2.22: Telegram pick-flip notifier.  When both vars are set,
          # tracker.log_picks pings the bot on every actionable flip
          # (PASS/PENDING -> STRONG/LEAN, side-flips, demotes).  Silent
          # no-op when unset, so this stays back-compat.
          TELEGRAM_BOT_TOKEN:   ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:     ${{ secrets.TELEGRAM_CHAT_ID }}
          # T2.30 / Phase 1.5: Supabase dual-write.  When both vars are
          # set, tracker.py mirrors every CSV write to the Supabase
          # picks_<season> + pick_changes tables so the dashboard can
          # cut over to Realtime reads in Phase 2 with no behavior
          # change.  Silent no-op when unset (back-compat for any
          # workflow that doesn't have the secrets configured yet).
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          ACTION: predict
        run: |
          YDAY=$(TZ='America/New_York' date -d 'yesterday' +%m/%d/%Y)
          TODAY_ISO=$(TZ='America/New_York' date +%Y-%m-%d)
          NOW_UTC=$(date -u +%Y-%m-%dT%H:%M:%SZ)

          # Helper: record a failure into data/system_errors.csv.  CSV
          # has a stable header; we append rather than rewrite.
          record_err() {
            local STEP="$1"; local CODE="$2"; local MSG="$3"
            mkdir -p data
            if [ ! -f data/system_errors.csv ]; then
              echo "captured_at_utc,date,step,exit_code,message" > data/system_errors.csv
            fi
            # CSV-escape the message (replace commas + quotes)
            local SAFE_MSG=$(echo "$MSG" | tr ',' ';' | tr '"' "'" | head -c 400)
            echo "$NOW_UTC,$TODAY_ISO,$STEP,$CODE,\"$SAFE_MSG\"" >> data/system_errors.csv
            echo "::warning::Step '$STEP' failed (exit $CODE): $SAFE_MSG"
          }

          # T-V21-2026-05-08c: one-shot retro-bet heal for the
          # 2026-05-08 NYY@MIL + DET@KC LINEUP PENDING wins.  Both
          # rows had a tentative STRONG NRFI lean and resolved NRFI
          # 0-0 in the 1st but never auto-bet because lineups didn't
          # post by T-60 lock.  Operator (joey11600) made the call
          # to count them as bets retroactively; this step flips
          # both to STRONG NRFI WIN, mirrors to Supabase, and fires
          # the standard strong_graded Telegram pings.  Idempotent
          # (script self-detects already-healed rows + relies on
          # notifications_log dedup) so this can stay in the workflow
          # forever without re-firing -- safe to leave or remove on
          # a future cleanup pass.  Placed BEFORE sync-csv-from-
          # supabase so the heal's Supabase mirror lands before the
          # sync pulls Supabase back into CSV; either order would
          # converge but this avoids a transient revert.  Soft-fail.
          echo "==> Heal: 2026-05-08 LINEUP PENDING wins..."
          if ! python tools/heal_2026_05_08_lineup_wins.py 2>heal_err.log; then
            record_err "heal-2026-05-08" "$?" \
              "$(tail -c 400 heal_err.log)"
          fi

          # T-V21-2026-05-09: apply user-supplied DK odds overrides.
          # Reads data/manual_odds_overrides.csv (empty by default --
          # operator adds a row whenever the auto-scrape misses a DK
          # price) and patches market_*_odds + recomputes
          # profit_loss_units on the matching pick row.  Idempotent so
          # safe every cron tick.  Placed BEFORE sync-csv-from-
          # supabase so the override's mirror lands authoritatively;
          # the sync's preserve-on-blank logic won't overwrite a
          # populated odds field.  Soft-fail.
          echo "==> Apply manual odds overrides..."
          if ! python tools/apply_manual_odds.py 2>manual_odds_err.log; then
            record_err "apply-manual-odds" "$?" \
              "$(tail -c 400 manual_odds_err.log)"
          fi

          # T-V21-2026-05-10b: apply confirmed cluster demotions.
          # Reads data/cluster_demotions.json (operator adds entries
          # only after loss_cluster_monitor.py confirms a cluster is
          # losing).  For each ungraded STRONG row matching an active
          # demotion, sets bet_placed='N' and units_risked='' so the
          # bet is suppressed without touching pick_side / pick_strength
          # (model verdict still visible on the dashboard).
          # Idempotent.  Placed before sync so the demotion's mirror
          # lands authoritatively.  Soft-fail.
          echo "==> Apply cluster demotions..."
          if ! python tools/apply_cluster_demotion.py 2>cluster_demotion_err.log; then
            record_err "apply-cluster-demotion" "$?" \
              "$(tail -c 400 cluster_demotion_err.log)"
          fi

          # 2026-05-11: V2.1 shadow track.  Runs AFTER apply_cluster_demotion
          # so the row's pick_side/strength reflect the live (V2.2) state;
          # the shadow records what V2.1 would have predicted independently.
          # See tools/v21_shadow_predict.py docstring + the v2.2 deploy entry
          # in CHANGELOG.  Soft-fail (shadow data is observability, not
          # a critical-path bet decision).
          echo "==> V2.1 shadow predict..."
          if ! python tools/v21_shadow_predict.py 2>v21_shadow_err.log; then
            record_err "v21-shadow-predict" "$?" \
              "$(tail -c 400 v21_shadow_err.log)"
          fi

          # T-V21-2026-05-07c: sync CSV from Supabase BEFORE any local
          # P&L computation.  Closes the chronic CSV-vs-Supabase
          # divergence: Railway's worker + import_odds writes real-odds
          # P&L to Supabase, but GHA grade-today uses tracker._calc_pnl
          # against an empty-odds CSV (the -110 fallback) -- so the
          # cron-committed CSV always lagged behind the dashboard's
          # real-odds totals.  This sweep pulls the odds + grade + bet
          # columns from Supabase into the matching CSV rows so the
          # downstream grade step computes against the same numbers
          # the dashboard shows.  Soft-fail.
          echo "==> Syncing CSV from Supabase..."
          if ! python tools/sync_csv_from_supabase.py --days 8 2>sync_err.log; then
            record_err "sync-csv-from-supabase" "$?" \
              "$(tail -c 400 sync_err.log)"
          fi

          echo "==> Catch-up grading $YDAY (yesterday)..."
          # Kept on GH Actions: grade-yesterday is a safety net for
          # west-coast late games that complete after midnight ET, plus
          # any games that the 5-min ODDS-ONLY grade missed.  Idempotent
          # (no-op once rows are terminal).
          if ! python mlb_first_inning_predictor.py --date "$YDAY" --grade 2>grade_err.log; then
            record_err "grade-yesterday" "$?" "$(tail -c 400 grade_err.log)"
            # Soft-fail: continue to today's predict
          fi

          # T4.19: RE-ADDED grade-today (was removed by T4.15).
          # Discovered the Railway mlb-first-inning project is empty --
          # no live_state.py worker, no predictor_loop.  T4.15 had
          # removed this assuming the T4.13 worker grade extension
          # would handle today's grades within ~10s of fi_complete.
          # With Railway down, that path doesn't exist, so this step
          # is the primary fast-grade path again.
          #
          # Why this is safe even though it produced telegram noise
          # before T4.16: the Contabo self-hosted runner eliminated
          # GH Actions cron lag, so the 5-min ODDS-ONLY tick actually
          # fires every 5 min (no queueing).  Telegram race protection
          # comes from T4.14 (FIRE_DAILY_DIGEST gate) + T4.17 (FIRE_
          # BANKROLL_MILESTONES gate) so wraps and milestones don't
          # multi-fire even if multiple writers grade in close
          # succession.
          #
          # When Railway services are restored and the worker grade
          # extension is verified working for 24+ hours, this step can
          # be removed again -- but only after that verification.
          echo "==> Live-grading today's completed 1st innings..."
          if ! python mlb_first_inning_predictor.py --date "$TODAY_ISO" --grade 2>>grade_err.log; then
            record_err "grade-today" "$?" "$(tail -c 400 grade_err.log)"
            # Soft-fail: even if grade-today errors, predict should still run.
          fi

          echo "==> Predicting today's slate..."
          if ! python mlb_first_inning_predictor.py 2>predict_err.log; then
            record_err "predict" "$?" "$(tail -c 400 predict_err.log)"
            # Hard-fail: predict is the heart of the slate; abort run
            exit 1
          fi

          # T4.12 (this commit): write per-pick reasoning JSON for the
          # FRESH slate so the dashboard's "Why this pick?" panel has
          # data BEFORE games are graded.  The same script also runs in
          # the nightly grade cron for historical record; this hourly
          # call keeps today's data current as picks lock + flip + relock.
          # Soft-fail so a reasoning error doesn't block the predict
          # commit -- diagnostic, not on the critical path.
          echo "==> Writing per-pick reasoning JSON for $TODAY_ISO..."
          set +e
          python tools/pick_reasoning_log.py "$TODAY_ISO" --include-pass 2>reason_err.log \
            || echo "::warning::pick_reasoning_log failed (non-blocking): $(tail -c 200 reason_err.log)"
          set -e

          # T-V21-2026-05-09: backup DK scrape from this runner.
          # Background: T-CLEANUP-2026-05-05 removed this block on the
          # premise that Railway's predictor_loop would capture DK
          # odds.  In practice Railway has gone down sporadically
          # (most recently triggering the 2026-05-05 / 2026-05-06
          # 40-57% fallback regression), and audit on 2026-05-09
          # found 112 of 220 graded STRONG bets across the season
          # had used the -110 fallback because no DK odds were ever
          # captured.  Re-adding the scrape here gives us a second
          # source: when this workflow runs on the self-hosted
          # runner (RUNNER_LABEL=self-hosted, IP not in Azure ranges
          # DK fingerprints), the scrape succeeds and patches any
          # missing odds; when it runs on the default ubuntu-latest
          # the scrape 403s and the soft-fail handler records the
          # error without blocking predict.  Idempotent: import_odds
          # honors the T2.23 bet-time lock (existing bet_placed=Y
          # rows with captured market_*_odds skip update) so re-runs
          # don't churn already-locked bets.
          echo "==> DK scrape (backup) for $TODAY_ISO..."
          DK_OUT="data/odds/dk_${TODAY_ISO}.csv"
          if ! python scrape_dk_odds.py 2>dk_err.log; then
            record_err "scrape-dk-odds" "$?" "$(tail -c 400 dk_err.log)"
          elif [ -s "$DK_OUT" ]; then
            echo "==> Importing DK odds from $DK_OUT..."
            if ! python mlb_first_inning_predictor.py \
                  --import-odds "$DK_OUT" --min-edge 0.02 \
                  2>import_odds_err.log; then
              record_err "import-odds" "$?" \
                "$(tail -c 400 import_odds_err.log)"
            fi
          else
            echo "==> No DK output produced (scrape may have 403d on " \
                 "Azure-range runner) -- relying on Railway capture."
          fi

          # T-V21-2026-05-07e: reconciliation sweep.  Asserts data +
          # notification invariants over the last 3 days and auto-heals
          # violations.  Runs after grade-today so any anomaly created
          # by this cycle heals before commit.  Soft-fail.
          echo "==> Running reconciliation sweep..."
          if ! python tools/reconcile.py --days 3 2>reconcile_err.log; then
            record_err "reconcile" "$?" \
              "$(tail -c 400 reconcile_err.log)"
          fi

          # T-V21-2026-05-10: loss-cluster streak monitor.  Watches for
          # defined STRONG-bet feature clusters (e.g. "STRONG YRFI
          # nrfi_p~0.40 + lambda~1.0") accumulating losses in their
          # recent-N window, and fires loss_cluster_streak Telegram if
          # any cluster crosses the threshold.  Operator's plan when
          # an alert fires: skip future bets in the cluster manually
          # OR run recalibrate_v2.py on trailing 30-60 days.  Soft-
          # fail; idempotent (notifications_log dedup).
          echo "==> Loss-cluster streak monitor..."
          if ! python tools/loss_cluster_monitor.py 2>loss_cluster_err.log; then
            record_err "loss-cluster-monitor" "$?" \
              "$(tail -c 400 loss_cluster_err.log)"
          fi

      - name: Lock commit — T-60 STRONG commit without a fresh price (T8.18, predict)
        # WHY THIS IS ITS OWN STEP RATHER THAN A LINE IN THE BLOCK ABOVE.
        # The predict block does `exit 1` when the predictor itself fails
        # (hard-fail, by design -- predict is the heart of the slate).  A
        # shell line placed after the import block would inherit that
        # abort, and so would a normal GHA step, because steps default to
        # `if: success()`.  But a failed PREDICT is exactly a night when
        # the lock commit matters MOST: the rows on the ledger still have
        # a lock window opening and a captured price sitting on them, and
        # nothing else will commit them.  Hence `always()`.
        #
        # ORDERING.  It runs after the import block (a commit must never
        # precede the price landing, or `_apply_odds_to_row`'s T2.23
        # early-return discards it) and before the end-of-day safety net
        # (which is the orphan heal that was retroactively stamping these
        # rows bet_placed=Y at a stale stake AFTER first pitch -- the T8.18
        # bug).  The reconciliation sweep lives inside the block above and
        # therefore runs first; that is harmless, it re-runs every tick.
        #
        # `!cancelled()`, NOT `always()`.  Both survive a failed predict --
        # which is the point, since a night predict falls over is exactly a
        # night nothing else will commit the locked rows.  But `always()`
        # ALSO fires on a CANCELLED run, and a cancellation is somebody
        # deliberately pulling the handle.  This step places bets; when a
        # human stops the workflow it should stop too.  Idempotence makes
        # that survivable, not correct.
        if: ${{ !cancelled() && steps.action.outputs.what == 'predict' }}
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          TELEGRAM_BOT_TOKEN:   ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:     ${{ secrets.TELEGRAM_CHAT_ID }}
          # Repo variable at /settings/variables/actions.  Absent or
          # anything other than "enabled" = silent no-op, so merging this
          # workflow change does NOT switch a new money-path writer on.
          NRFI_LOCK_COMMIT:     ${{ vars.NRFI_LOCK_COMMIT }}
        run: |
          set +e
          TODAY_ISO=$(TZ='America/New_York' date +%Y-%m-%d)
          python tools/lock_commit.py --date "$TODAY_ISO" 2>&1 \
            || echo "::warning::lock_commit failed (non-blocking)"

      - name: Run grader (grade)
        if: steps.action.outputs.what == 'grade'
        # Grade today AND yesterday (in ET).  GitHub Actions cron can fire
        # hours late; the scheduled 11:30pm ET grade has been observed
        # firing as late as 2-3am ET the next day, at which point
        # `TZ=America/New_York date` returns the WRONG date and the
        # original slate goes ungraded.  Grading both dates is idempotent
        # (already-graded games stay graded, new ones get filled in).
        env:
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
          # T2.30 / Phase 1.5: Supabase dual-write (see predict step
          # above for full rationale).  Mirrors graded results to
          # Supabase the moment they land in the CSV.
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          ACTION: grade
          # T4.14: ONLY this cron is authorized to fire the daily wrap
          # ping.  All other writers (predict cron, odds-only 5-min tick,
          # Railway predictor_loop) leave FIRE_DAILY_DIGEST unset, which
          # makes their grade_date() calls skip the digest path entirely
          # -- prevents the 2-5 wrap pings/slate that kept arriving as
          # different writers raced past notifications_log dedup.
          FIRE_DAILY_DIGEST: "1"
        run: |
          TODAY=$(TZ='America/New_York' date +%m/%d/%Y)
          YDAY=$(TZ='America/New_York' date -d 'yesterday' +%m/%d/%Y)
          TODAY_ISO=$(TZ='America/New_York' date +%Y-%m-%d)
          NOW_UTC=$(date -u +%Y-%m-%dT%H:%M:%SZ)

          record_err() {
            local STEP="$1"; local CODE="$2"; local MSG="$3"
            mkdir -p data
            if [ ! -f data/system_errors.csv ]; then
              echo "captured_at_utc,date,step,exit_code,message" > data/system_errors.csv
            fi
            local SAFE_MSG=$(echo "$MSG" | tr ',' ';' | tr '"' "'" | head -c 400)
            echo "$NOW_UTC,$TODAY_ISO,$STEP,$CODE,\"$SAFE_MSG\"" >> data/system_errors.csv
            echo "::warning::Step '$STEP' failed (exit $CODE): $SAFE_MSG"
            # Optional webhook alert -- set ALERT_WEBHOOK_URL secret in
            # the repo (Slack incoming webhook, Discord, ntfy.sh, etc.).
            # Posts JSON {text} which Slack/Discord both accept.
            if [ -n "${ALERT_WEBHOOK_URL:-}" ]; then
              local PAYLOAD=$(printf '{"text":"NRFI %s [%s]: step \"%s\" failed (exit %s) -- %s"}' \
                "$ACTION" "$TODAY_ISO" "$STEP" "$CODE" "$SAFE_MSG")
              curl -fsS -X POST -H 'Content-Type: application/json' \
                -d "$PAYLOAD" "$ALERT_WEBHOOK_URL" >/dev/null 2>&1 || true
            fi
