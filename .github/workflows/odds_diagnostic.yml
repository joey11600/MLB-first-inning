# Odds diagnostic capture -- the two prices the ledger never recorded.
#
# WHY (rollout plan 2026-08-22, items #6 and #7).
#   1. LINE SHOPPING. Every bet is priced at ONE book carrying a 6.55% vig
#      (measured over 1,472 priced 2026 games; a normal sides market is 4.76%),
#      while FanDuel / BetMGM / BetRivers / BetOnline all quote the first-inning
#      total. The size of the cross-book spread has never been measured because
#      no multi-book file was ever kept (sportsbook column: 1,448 DraftKings,
#      24 FanDuel). This captures it daily.
#   2. THE F5 QUESTION. The same model inputs rank first-5-innings scoring far
#      better than the first inning (memory 2026-08-21_target_horizon: 2026 AUC
#      .526 -> .569) and the F5 total carries a standard ~4.5% vig. Whether we
#      beat THAT market is unknown because its price was never captured.
#
# WHAT IT WRITES. data/diagnostics/odds/raw_<ET date>.csv: every book x market x
# outcome for today's events, long format. DIAGNOSTIC ONLY -- a different shape
# from the ledger's odds files, and never imported (tracker.import_odds would
# price the ledger at whichever book came last; see tools/fetch_odds_api.py).
#
# COST. ~1 credit per event per region per market returned: ~15 events x 2
# markets = ~30 credits per run. ONE run a day (1 PM ET) since 2026-08-23 --
# the lock-time fetch on Railway now asks every book in the same call it uses
# for the ledger (tools/fetch_odds_api.py --ledger-book), so the board's "best
# price" is refreshed AT THE LOCK for every game and the afternoon snapshots
# were redundant. This run keeps the morning view of all books and the F5
# lines (the research questions). ~30/day here + ~45/day on Railway = ~75/day,
# ~2,300/month of the 20,000 plan.
#
# THE MONEY PATH COMES FIRST. `--min-credits 2000` makes THIS capture refuse
# to spend once fewer than 2,000 credits would remain, so a runaway cadence
# here can never starve the lock-time price fetch (which needs ~50/day). The
# Railway fetch keeps its own, much lower floor (ODDS_API_MIN_CREDITS).
#
# REQUIRES the `ODDS_API_KEY` repository secret (set 2026-08-23 with the
# 20K-credit key). Without it the run prints what to do and exits 0 --
# nothing fails, nothing is captured.
name: odds diagnostic (multi-book + F5)

on:
  schedule:
    # One snapshot a day at 13:00 ET (~30 credits). Freshness at the lock
    # comes from the Railway at-lock fetch, which mirrors every book's quote
    # into the same table (see COST above). Was 4x/day on 2026-08-23.
    - cron: "0 17 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: odds-diagnostic
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Capture every book's first-inning and F5 totals (diagnostic)
        env:
          ODDS_API_KEY:         ${{ secrets.ODDS_API_KEY }}
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          set +e
          if [ -z "${ODDS_API_KEY}" ]; then
            echo "::notice::ODDS_API_KEY is not set for GitHub Actions. To enable this capture: GitHub repo -> Settings -> Secrets and variables -> Actions -> New repository secret -> Name ODDS_API_KEY, Value = your The Odds API key (the same one Railway uses)."
            exit 0
          fi
          D=$(TZ=America/New_York date +%F)
          T=$(TZ=America/New_York date +%H%M)
          # one file per snapshot (the CSV is the record; Supabase is the mirror)
          python tools/fetch_odds_api.py \
            --regions us \
            --markets totals_1st_1_innings,totals_1st_5_innings \
            --skip-started \
            --min-credits 2000 \
            --raw-output "data/diagnostics/odds/raw_${D}_${T}.csv" \
            || echo "::warning::odds diagnostic capture failed (non-blocking)"
          # mirror into Supabase so the dashboard can show the best available
          # price per pick (table odds_multibook; anon read, like picks_2026)
          python tools/odds_multibook_to_supabase.py "data/diagnostics/odds/raw_${D}_${T}.csv" \
            || echo "::warning::odds_multibook mirror failed (non-blocking; CSV committed regardless)"

      - name: Commit the capture
        run: |
          set -e
          git config user.name  "nrfi-bot"
          git config user.email "nrfi-bot@users.noreply.github.com"
          git add data/diagnostics/odds/ 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "auto: odds diagnostic capture $(TZ=America/New_York date +%F)"
          # The predict cron pushes ~hourly, so rebase onto whatever landed
          # meanwhile before each attempt.  2026-09-05 (T8.43): five tries ten
          # seconds apart was under a minute of patience, and on 2026-08-24..30
          # every attempt got GitHub's server-side "fatal error in commit_refs
          # / [remote rejected] (failure)" -- a transient that can outlast a
          # minute -- so six of seven captures reached Supabase but never the
          # repo.  Now: up to 9 attempts with backoff (~17 min in total), a
          # fresh fetch + rebase every time, and the failure is LOUD in the
          # job summary instead of a green run with nothing behind it.
          PUSHED=0
          for WAIT in 15 30 60 90 120 180 240 300 0; do
            if git fetch origin "${GITHUB_REF_NAME}" \
               && git rebase "origin/${GITHUB_REF_NAME}" \
               && git push origin HEAD:"${GITHUB_REF_NAME}"; then
              PUSHED=1; break
            fi
            git rebase --abort 2>/dev/null || true
            echo "push attempt failed; retrying in ${WAIT}s"
            [ "$WAIT" -gt 0 ] && sleep "$WAIT"
          done
          if [ "$PUSHED" != "1" ]; then
            echo "::error::odds capture committed locally but could not be pushed after 9 attempts (~17 min). The rows ARE in Supabase (odds_multibook); the repo copy for this date is missing."
            exit 1
          fi
