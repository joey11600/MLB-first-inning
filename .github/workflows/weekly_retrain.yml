name: Weekly NRFI model retrain (validated)

# Validated weekly retrain.  Fits a fresh T1+B1+calibrator on
# (2024 + 2025 + 2026 YTD), evaluates against current production on a
# 7-day holdout, and only commits new model files if the candidate
# passes the validation gate (P&L within tolerance, Brier no worse by
# more than +0.005).
#
# Why workflow_dispatch only (no schedule yet):
# CLAUDE.md mandates out-of-sample validation for any model change.
# The previous weekly recalibrate cron was disabled on 2026-05-11
# precisely because it shipped without validation.  This workflow has
# validation built in via tools/weekly_refit.py, but I want to watch
# a few manual runs before letting it run unattended.  Once we trust
# it (~4 weeks of clean manual runs), add a schedule entry like:
#     - cron: "0 10 * * 1"   # 6am EDT Monday
on:
  workflow_dispatch:
    inputs:
      reason:
        description: "Why are we retraining now?"
        required: false
        default: "manual weekly cadence"

jobs:
  retrain:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: claude/mlb-inning-run-predictor-QyazL
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install deps
        run: pip install numpy

      - name: Run validated refit
        run: python tools/weekly_refit.py
        # Exit 0 = candidate shipped (production files were rewritten)
        # Exit 1 = candidate failed validation gate (production unchanged)
        # Exit 2 = data/script error

      - name: Commit + push if production changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- data/lr_t1.json data/lr_b1.json data/calibration_v2.json; then
            echo "no model changes to commit"
            exit 0
          fi
          git add data/lr_t1.json data/lr_b1.json data/calibration_v2.json data/*.bak-*
          git commit -m "weekly refit ${{ github.run_id }}: validated retrain shipped

Reason: ${{ github.event.inputs.reason }}

Triggered by workflow_dispatch from $GITHUB_ACTOR.
See tools/weekly_refit.py for the validation gate (P&L tolerance ${{ env.PL_TOL }}u, Brier tolerance ${{ env.BRIER_TOL }}).
Rollback: revert this commit."
          git push origin claude/mlb-inning-run-predictor-QyazL
        env:
          PL_TOL:    "1.0"
          BRIER_TOL: "0.005"
