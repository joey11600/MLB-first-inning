# Tests + parity guards, ON EVERY PUSH.
#
# WHY THIS WORKFLOW EXISTS.
# Until 2026-08-07 this repo had NO automated check on any push. The only
# enforcement anywhere was Vercel's `prebuild` (check-units-guard +
# check-kelly-parity), which:
#   * runs only when Vercel builds, and since T8.4 a data-only push does
#     not build at all;
#   * checks the DASHBOARD against a committed fixture, so a change to the
#     Python that sizes the real bet passes green.
#
# So the thing that stakes money had zero tests and zero CI, on a system
# whose picks are sold to subscribers. This closes both halves.
name: tests

on:
  push:
    branches: ["**"]
    # Data-only commits cannot change behaviour, and the automation pushes
    # ~30 of them a day. Skipping them here is the same reasoning as the
    # Vercel ignoreCommand (T8.4) -- and the same care: everything NOT under
    # data/ still runs, so a Python or dashboard change always tests.
    paths-ignore:
      - "data/**"
  pull_request:
  workflow_dispatch:

# A newer push supersedes an in-flight run on the same ref. Without this the
# hourly automation could queue runs faster than they finish.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  money:
    name: money path (pytest + fixture parity)
    # ubuntu-latest, NOT the self-hosted runner: this must still run when the
    # VPS is down, which is exactly when someone is pushing a fix.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install deps
        id: deps
        run: |
          pip install -r requirements.txt
          pip install pytest

      # NEITHER CHECK GATES THE OTHER (T8.26).
      #
      # A step with no `if:` carries an implicit `success()`, so by default
      # every step is gated on all the ones before it. That is right for a
      # BUILD PIPELINE, where a later stage consumes an earlier stage's
      # output, and wrong for INDEPENDENT CHECKS, where it means the first
      # one to break decides whether the others get to speak.
      #
      # It broke exactly that way on 2026-08-10 (T8.25): the tests died at
      # COLLECTION on a sys.path accident -- a plumbing fault that says
      # nothing whatever about the money math -- and took the parity check
      # down with it for four consecutive pushes, across a stake-allocation
      # change (T8.19), a ledger fix (T8.23) and a notification fix (T8.22).
      # The one guard that would have caught a real stake drift was silent
      # for the entire window, and the CI page said only "failing", which
      # everyone read as "that test thing again".
      #
      # So parity runs FIRST (it is the money-critical one, and it is
      # cheap), and the tests run whatever it concluded. Swapping the order
      # ALONE would only have mirrored the bug -- a parity failure would
      # then hide the tests.
      #
      # `!cancelled()` rather than `always()`: this workflow sets
      # cancel-in-progress, and the hourly automation supersedes runs
      # routinely, so `always()` would keep working on a run that has
      # already been abandoned. The `steps.deps` clause keeps the ONE
      # genuine prerequisite -- with no dependencies installed neither check
      # can produce a meaningful verdict, and a wall of import errors under
      # a failed `pip install` buries the real cause instead of adding to
      # it. Prerequisite, yes; peer check, no.

      # THE HALF VERCEL CANNOT DO. check-kelly-parity.mjs compares the
      # dashboard to a committed fixture and never invokes Python, so a
      # changed money rule in tracker.py passes it green. This regenerates
      # the fixtures from the live Python and fails if they moved --
      # demonstrated on 2026-08-07 by setting NRFI_KELLY_ROUNDING=0.5, which
      # changed a real stake from 4.0u to 3.5u while the .mjs guard still
      # printed "ok".
      - name: Fixtures still match Python
        run: python tools/parity_fixtures.py --check

      - name: Money-path tests
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: pytest tests/ -v --tb=short

  dashboard:
    name: dashboard guards
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install
        id: install
        working-directory: dashboard
        run: npm ci

      # These are the two guards Vercel runs in `prebuild`. Running them here
      # too means they still fire on a push that Vercel skips, and they fail
      # fast rather than at deploy time.
      #
      # NEITHER GATES THE OTHER, same rule as the `money` job (T8.26). These
      # are independent checks, not pipeline stages: the units guard writes a
      # probe file and type-checks it, the parity guard diffs a committed
      # fixture against Python. Neither reads the other's output. Left
      # sequenced under the implicit `success()`, a units-guard failure would
      # silence the parity guard -- and the parity guard is the MONEY one.
      #
      # This was missed when T8.26 landed because the two halves of the
      # stake-math protection live in DIFFERENT JOBS: `Fixtures still match
      # Python` above compares the fixtures to the live Python, this one
      # compares the dashboard's TypeScript to the same fixtures, and fixing
      # only the first left the second silenceable. When you decouple one
      # guard, look for its other half.
      - name: Kelly + pass-price parity (TypeScript vs fixture)
        working-directory: dashboard
        run: node scripts/check-kelly-parity.mjs

      - name: Units guard (compile-time brand on cumulative sums)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        working-directory: dashboard
        run: node scripts/check-units-guard.mjs
