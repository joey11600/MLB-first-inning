# Model gate -- does this change move the predictions, and which way?
#
# WHY THIS IS ITS OWN WORKFLOW AND NOT A JOB IN tests.yml.
# `tests.yml` carries `paths-ignore: data/**`, because the automation pushes
# ~30 data commits a day and none of them can change behaviour. But THE MODEL
# WEIGHTS LIVE UNDER data/ -- `data/lr_t1.json`, `data/lr_b1.json`,
# `data/calibration_v2.json`. A weights change is the single most
# consequential edit anyone can make here, and in tests.yml it would match
# `paths-ignore` and trigger nothing at all. So this file uses a precise
# ALLOWLIST of the paths that actually define the model, which lets it watch
# those artifacts without waking on the daily data churn.
#
# WHAT IT DOES. Scores a fixed committed holdout of real 2026 games twice --
# once with the code+artifacts from before this push, once with after -- and
# reports whether any prediction moved. See tools/model_gate.py for what that
# does and does not prove; the short version is that it is a tripwire, not a
# verdict, and the three-split out-of-sample protocol is still yours to run.
#
# IT BLOCKS. Operator's call, 2026-08-10, reversing the warn-only choice made
# earlier the same day. It fails the build when the change makes predictions
# WORSE -- in aggregate, on any single season, or in the mixed pattern that
# means "fitted to one era". A change that IMPROVES every season passes, so
# real model work is not obstructed.
#
# The original worry about blocking was real and is answered, not ignored:
# a genuine fix at 7pm with games starting clears the gate by putting
# `[gate-override]` in a commit message. No secret, no dashboard, no second
# person -- and it is in git history forever, so every override is
# attributable. A gate nobody can bypass under time pressure gets deleted;
# one that can be bypassed loudly survives.
#
# It also blocks on a real change to `data/thresholds.json`, because a
# threshold is the CUT applied after the probability: it changes what gets
# BET while every probability stays identical, and this gate measures
# probabilities. It cannot judge that change, and silence would read as
# approval. `writtenAtUtc` is ignored -- every predict tick rewrites it.
name: model gate

on:
  push:
    paths:
      # The model itself: feature construction, the two-stage forward pass,
      # the calibrator, and the training code that produces the weights.
      - "mlb_first_inning_predictor.py"
      - "two_stage_model.py"
      - "calibration.py"
      - "recalibrate_v2.py"
      - "rebuild_park_factors.py"
      # The fitted artifacts. These are under data/ and are exactly why this
      # workflow cannot live in tests.yml.
      - "data/lr_t1.json"
      - "data/lr_b1.json"
      - "data/calibration_v2.json"
      - "data/fi_park_factors.json"
      - "data/thresholds.json"
      # The gate and its holdout, so a change to the measuring instrument is
      # itself measured.
      - "tools/model_gate.py"
      - "data/backtests/*_ptfix.csv"
      - ".github/workflows/model_gate.yml"
  pull_request:
  workflow_dispatch:

concurrency:
  group: model-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: predictions moved?
    # ubuntu-latest, NOT the self-hosted runner: same reasoning as tests.yml --
    # this must still run when the VPS is down.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          # Need history to check out the pre-push state. 0 = full; the repo
          # is ~84MB of history, which is cheap next to being unable to find
          # the base commit when a push contains several commits.
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install deps
        id: deps
        run: pip install -r requirements.txt

      - name: Score the candidate (this push)
        id: cand
        run: python tools/model_gate.py --fingerprint /tmp/candidate.json

      - name: Score the baseline (before this push)
        id: base
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: |
          set -euo pipefail
          # `github.event.before` is the pre-push tip, which is correct when a
          # push carries several commits (HEAD^ would only undo the last one).
          # It is unset on PRs and all-zeroes on a branch's first push, so
          # fall back to the first parent.
          BASE="${{ github.event.before }}"
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            BASE="$(git rev-parse HEAD^ 2>/dev/null || true)"
          fi
          if [ -z "$BASE" ]; then
            echo "::warning::no baseline commit available (first commit?) -- skipping comparison"
            exit 0
          fi
          echo "baseline: $BASE"
          # Exported so the Report step can scan exactly the pushed commit
          # range for [gate-override], rather than guessing at HEAD alone.
          echo "base_sha=$BASE" >> "$GITHUB_OUTPUT"

          # A worktree, not a checkout: it leaves the current tree untouched
          # so the candidate fingerprint we just took stays valid.
          git worktree add --detach /tmp/base "$BASE"

          # THE INSTRUMENT IS HELD CONSTANT, THE MODEL IS WHAT VARIES.
          # Copy today's gate script into the old tree rather than running the
          # old tree's copy -- otherwise a change to model_gate.py would show
          # up as a "model change", and a baseline predating the gate would
          # have no script at all.
          cp tools/model_gate.py /tmp/base/tools/model_gate.py

          # THE HOLDOUT IS PART OF THE INSTRUMENT TOO, and forgetting that
          # failed run 31448097778: the push that ADDED the 2024/2025 files
          # had a baseline that did not contain them, so the baseline scored
          # `holdout missing` and the whole gate errored. Copy the data in for
          # the same reason as the script -- we are varying the MODEL, not the
          # yardstick. This also means a future change to the holdout compares
          # both commits on the new data rather than breaking.
          mkdir -p /tmp/base/data/backtests
          cp data/backtests/*_ptfix.csv /tmp/base/data/backtests/
          cd /tmp/base && python tools/model_gate.py --fingerprint /tmp/baseline.json

      - name: Report
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: |
          set -uo pipefail
          if [ ! -f /tmp/baseline.json ]; then
            echo "no baseline to compare against -- nothing to report"
            exit 0
          fi

          # THE ESCAPE HATCH, and why it is a commit message rather than a
          # button. The operator's standing worry about a blocking gate is a
          # genuine fix at 7pm with games starting. `[gate-override]` clears
          # it immediately, needs no secret, no dashboard and no second
          # person -- and is written into git history forever, so an override
          # is always attributable after the fact. A gate you cannot bypass
          # under time pressure gets deleted; one you can bypass loudly
          # survives.
          # THE SUBJECT LINE ONLY, NEVER THE BODY -- and that is a bug fix,
          # not a preference. Matching the whole message meant any commit that
          # merely MENTIONED the token overrode the gate: the commit that
          # introduced this escape hatch (3c394956) and the one documenting it
          # (377993d4) both carry `[gate-override]` in their bodies, so both
          # would have silently disabled the gate they were shipping. Any
          # future changelog entry, revert or doc quoting the token would do
          # the same. An escape hatch you can trip by writing prose is not an
          # escape hatch. It must be typed deliberately, on the subject line.
          OVERRIDE=""
          if git log --format=%s "${BASE_SHA}..HEAD" 2>/dev/null \
               | grep -qF '[gate-override]'; then
            OVERRIDE="yes"
          fi

          # `--thresholds` hands the gate both data/thresholds.json files.
          # The baseline worktree still holds the pre-push copy; the repo root
          # holds this push's. The gate ignores `writtenAtUtc`, which every
          # predict tick rewrites (~20/day) and which means nothing.
          set +e
          python tools/model_gate.py \
            --compare /tmp/baseline.json /tmp/candidate.json \
            --thresholds /tmp/base/data/thresholds.json data/thresholds.json \
            --blocking | tee /tmp/report.txt
          RC=${PIPESTATUS[0]}
          set -e

          {
            echo '## Model gate'
            if [ "$RC" != "0" ] && [ -n "$OVERRIDE" ]; then
              echo '> **BLOCKED, but overridden** by `[gate-override]` in a commit message.'
            fi
            echo '```'
            cat /tmp/report.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$RC" != "0" ] && [ -n "$OVERRIDE" ]; then
            echo "::warning::model gate BLOCKED but [gate-override] was present -- allowing"
            exit 0
          fi
          exit "$RC"
        env:
          BASE_SHA: ${{ steps.base.outputs.base_sha }}
